# Fork-safe collector half of the Fern preview cleanup pair. It captures the
# preview URL from the PR comment for the companion cleanup workflow.

name: "Preview Fern Docs: Close"

on:
  pull_request:
    types: [closed]

jobs:
  close:
    permissions:
      pull-requests: read
    uses: NVIDIA/docs-builder/.github/workflows/_fern_docs_preview_close_collect.yml@main
