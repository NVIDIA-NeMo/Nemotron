# Fork-safe collector half of the Fern docs preview pair. The companion
# workflow runs in the base repository context and publishes the preview.

name: "Preview Fern Docs: Build"

on:
  pull_request:
    paths:
      - "docs/fern/**"
      - ".github/workflows/fern-docs-preview-build.yml"

jobs:
  collect:
    permissions:
      contents: read
    uses: NVIDIA/docs-builder/.github/workflows/_fern_docs_preview_build.yml@main
    with:
      fern-directory: docs/fern
