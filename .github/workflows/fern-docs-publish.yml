# Publishes the Fern documentation site on changes to main or manual dispatch.
#
# Required repository or organization secrets:
# - DOCS_FERN_AWS_ROLE_TO_ASSUME
# - DOCS_FERN_SECRET_ID

name: Publish Fern Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/fern/**"
      - ".github/workflows/fern-docs-publish.yml"
  workflow_dispatch:

concurrency:
  group: fern-docs-publish
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: NVIDIA/docs-builder/.github/workflows/_fern_docs_publish.yml@main
    with:
      fern-directory: docs/fern
    secrets:
      DOCS_FERN_AWS_ROLE_TO_ASSUME: ${{ secrets.DOCS_FERN_AWS_ROLE_TO_ASSUME }}
      DOCS_FERN_SECRET_ID: ${{ secrets.DOCS_FERN_SECRET_ID }}
