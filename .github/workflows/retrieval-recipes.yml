name: Retrieval recipe contracts

on:
  pull_request:
    paths:
      - ".github/workflows/retrieval-recipes.yml"
      - "src/nemotron/recipes/embed/**"
      - "src/nemotron/recipes/rerank/**"
      - "src/nemotron/recipes/_retrieval/**"
      - "src/nemo_runspec/**"
      - "src/nemotron/cli/commands/embed/**"
      - "src/nemotron/cli/commands/rerank/**"
      - "tests/recipes/**"
      - "scripts/retrieval/**"
      - "skills/nemotron-retrieval-recipes/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/retrieval-recipes.yml"
      - "src/nemotron/recipes/embed/**"
      - "src/nemotron/recipes/rerank/**"
      - "src/nemotron/recipes/_retrieval/**"
      - "src/nemo_runspec/**"
      - "src/nemotron/cli/commands/embed/**"
      - "src/nemotron/cli/commands/rerank/**"
      - "tests/recipes/**"
      - "scripts/retrieval/**"
      - "skills/nemotron-retrieval-recipes/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: tests/recipes/retrieval_ci/uv.lock
      - name: Install the locked CPU test environment
        run: |
          uv sync --frozen --project tests/recipes/retrieval_ci
          uv pip install --python tests/recipes/retrieval_ci/.venv/bin/python \
            --no-deps --no-build-isolation -e .
      - name: Run CPU contracts without skipped tests
        run: |
          tests/recipes/retrieval_ci/.venv/bin/python tests/recipes/retrieval_ci/run.py
