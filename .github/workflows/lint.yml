name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      # Pyflakes errors (F) and syntax errors (E9) only; the excludes come from
      # [tool.ruff] in pyproject.toml. Keep the version in sync with
      # .pre-commit-config.yaml.
      - name: ruff check (F, E9)
        run: uvx ruff@0.15.2 check --select F,E9 --output-format github .
