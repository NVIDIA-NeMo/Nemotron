[project]
name = "long-context-chat-sdg"
version = "0.1.0"
description = "Generate long-context, retrieval-grounded tool-call conversations with NeMo Data Designer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "data-designer==0.7.0",
    "numpy>=2.0,<3",
    "omegaconf>=2.3,<3",
    "openai>=2,<3",
    "pydantic>=2.12,<3",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "scikit-learn>=1.8,<1.9",
    "sentence-transformers>=5,<6",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
lancedb = ["lancedb>=0.25,<0.27"]

# Data Designer discovers the plugin via this entry point.
[project.entry-points."data_designer.plugins"]
long-context-chat-sdg = "long_context_chat_sdg.plugin:conversation_simulator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["long_context_chat_sdg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
