[project]
name = "nemotron"
version = "0.1.0"
description = "Reproducible training recipes for NVIDIA Nemotron model family - transparent pipelines for data preparation, training, and evaluation across all stages"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Nemotron Contributors"}
]
keywords = ["nemotron", "nvidia", "llm", "training", "reproducible", "pipelines", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "nemo-run @ git+https://github.com/NVIDIA-NeMo/Run.git@a8425c9f11a45412e6d5338cecb1c014b0ecc0c4",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "omegaconf>=2.3.0",
    "rich>=13.0.0",
    "textual>=0.70.0",
    "ray[default,data]>=2.54",
    "fsspec>=2024.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "xxhash>=3.4.0",
    "transformers>=4.57.6,<5.0",
    "huggingface_hub>=0.20.0",
    "datasets>=2.14.0",  # Required for ray.data.from_huggingface
    "pyyaml>=6.0",
    "tomlkit>=0.12.0",
    "colorama>=0.4.6",
    "wandb>=0.23.1",
    "jinja2>=3.0.0",  # Required for chat templates in transformers
    "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.15.0"]
s3 = ["s3fs>=2024.0.0"]
gcs = ["gcsfs>=2024.0.0"]
sentencepiece = ["sentencepiece>=0.2.0"]
xenna = ["cosmos-xenna"]
# steps/tokenizer_extension. fastText is a hard import in the FOCUS embedding
# init; indic-nlp-library supplies the Devanagari normalizer (without it the
# extend step falls back to NFKC-only and trains a *different* tokenizer).
tokenizer-extension = [
    "accelerate>=1.0",
    "fasttext-wheel>=0.9.2",
    "indic-nlp-library>=0.91",
]
# The default base_model is a Mamba-hybrid and will not load without these.
# Separate from `tokenizer-extension` because `extend` is CPU-only.
tokenizer-extension-gpu = [
    "mamba-ssm>=2.2; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "causal-conv1d>=1.4; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
]
# Audio/video data prep (e.g. omni3 Valor32k SFT). imageio-ffmpeg ships a static
# ffmpeg binary as a wheel so we don't need apt-get on the data-prep worker image.
audio = [
    "webdataset>=0.2.86",
    "imageio-ffmpeg>=0.5.1",
]
# Synthetic data generation pipelines, including Persona MCQ and the recipes under
# `nemotron data sdg ...`. Installing this extra provides Data Designer plus
# the embedding runtime used for semantic deduplication. Long-document recipe
# scripts also work standalone via `uv run --no-project` using PEP 723 deps.
# Data Designer 0.6/0.7 have conflicting cryptography requirements; 0.8 needs
# Starlette >=1.2 while the current NeMo-Run/LeptonAI chain requires Starlette <1.
data-sdg = [
    "data-designer>=0.5.9,<0.6; python_version>='3.11' and python_version<'3.14'",
    "sentence-transformers>=5.0.0,<6.0.0; python_version>='3.11' and python_version<'3.14'",
    "torch>=2.10,<2.11; python_version>='3.11' and python_version<'3.14'",
]
byob = [
    # BYOB CPU/runtime dependencies. GPU semantic-dedup/outlier dependencies live in `byob-gpu`.
    "cosmos-xenna>=0.2,<0.3; python_version>='3.11' and python_version<'3.14'",
    "data-designer>=0.5.6; python_version>='3.11' and python_version<'3.14'",
    "nemo-curator[translation_all]==1.3.0 ; python_version>='3.11' and python_version<'3.14'",
    "datasets>=2.14.0; python_version>='3.11'",
    "numpy>=2.2,<3; python_version>='3.11'",
    "pandas>=2.1.0; python_version>='3.11'",
    "pyarrow>=14.0.0; python_version>='3.11'",
    "pyyaml>=6.0; python_version>='3.11'",
    "pydantic>=2.0.0; python_version>='3.11'",
    "requests>=2.0.0; python_version>='3.11'",
    "tqdm; python_version>='3.11'",
    "urllib3>=2.7.0,<3; python_version>='3.11'",
    "obstore>=0.8,<0.9; python_version>='3.11'",
    "portpicker>=1.6,<2; python_version>='3.11'",
    "pulp>=3.3,<4; python_version>='3.11'",
    "attrs>=25.4,<26; python_version>='3.11'",
    "cattrs>=25.3,<26; python_version>='3.11'",
    "jinja2>=3.1,<4; python_version>='3.11'",
    "loguru>=0.7,<1; python_version>='3.11'",
    "tabulate>=0.9,<1; python_version>='3.11'",
    "sacrebleu>=2.6.0,<3.0.0; python_version>='3.11'",
    "iso639-lang>=2.6.0,<3.0.0; python_version>='3.11'",
    "bcp47>=0.1.0; python_version>='3.11' and python_version<'3.14'",
    "httpx",
]
bfcl-mcp = [
    # The 2026 protocol requires MCP Python SDK v2. Data Designer currently pins
    # mcp<2, so the gateway/discovery runtime must live in a separate environment
    # from the model-authoring `byob` extra.
    "jsonschema>=4.0; python_version>='3.11'",
    "mcp>=2,<3; python_version>='3.11' and python_version<'3.14'",
    "pyyaml>=6.0; python_version>='3.11'",
    "pydantic>=2.0.0; python_version>='3.11'",
    "starlette>=0.50.0; python_version>='3.11'",
    "uvicorn>=0.38.0; python_version>='3.11'",
]
byob-gpu = [
    "torch>=2.10,<2.11; python_version>='3.11'",
    "transformers>=4.57.6,<5.0; python_version>='3.11'",
    "sentence-transformers>=5.0.0,<6.0.0; python_version>='3.11'",
    "scikit-learn>=1.7.0,<1.8.0; python_version>='3.11'",
    "cupy-cuda12x>=14.0,<15; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "cuda-bindings>=12.9,<13; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "cuda-python>=12.9,<13; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "cudf-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "cuml-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "pylibcugraph-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "pylibraft-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "raft-dask-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "rapidsmpf-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
]
translate = [
    "nemo-curator[translation_all]==1.3.0 ; python_version>='3.11' and python_version<'3.14'",
    "pyarrow>=14.0.0; python_version>='3.11'",
    "pyyaml>=6.0; python_version>='3.11'",
    "obstore>=0.8,<0.9; python_version>='3.11'",
    "portpicker>=1.6,<2; python_version>='3.11'",
    "pulp>=3.3,<4; python_version>='3.11'",
    "attrs>=25.4,<26; python_version>='3.11'",
    "cattrs>=25.3,<26; python_version>='3.11'",
    "jinja2>=3.1,<4; python_version>='3.11'",
    "loguru>=0.7,<1; python_version>='3.11'",
    "tabulate>=0.9,<1; python_version>='3.11'",
    "sacrebleu>=2.6.0,<3.0.0; python_version>='3.11'",
    "bcp47>=0.1.0; python_version>='3.11' and python_version<'3.14'",
]
evaluator = ["nemo-evaluator-launcher>=0.2.6,<0.3"]
curate = [
    "nemo-curator[text_cpu]==1.3.0 ; python_version>='3.11' and python_version<'3.14'",
    "cosmos-xenna",
    "huggingface_hub>=0.20.0; python_version>='3.11'",
    "pyyaml>=6.0; python_version>='3.11'",
]
curate-gpu = [
    "nemo-curator[deduplication_cuda12,text_cpu]==1.3.0 ; python_version>='3.11' and python_version<'3.14' and platform_system=='Linux' and platform_machine=='x86_64'",
    "huggingface_hub>=0.20.0; python_version>='3.11'",
    "pyyaml>=6.0; python_version>='3.11'",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
all = [
    "wandb>=0.15.0",
    "s3fs>=2024.0.0",
    "gcsfs>=2024.0.0",
    "sentencepiece>=0.2.0",
    "cosmos-xenna",
    "webdataset>=0.2.86",
    "imageio-ffmpeg>=0.5.1",
    "data-designer>=0.5.9,<0.6; python_version>='3.11' and python_version<'3.14'",
    "nemo-curator[translation_all]==1.3.0 ; python_version>='3.11' and python_version<'3.14'",
    "pandas>=2.1.0; python_version>='3.11'",
    "sentence-transformers>=5.0.0,<6.0.0; python_version>='3.11'",
    "torch>=2.10,<2.11; python_version>='3.11'",
    "scikit-learn>=1.7.0,<1.8.0; python_version>='3.11'",
    "sacrebleu>=2.6.0,<3.0.0; python_version>='3.11'",
    "iso639-lang>=2.6.0,<3.0.0; python_version>='3.11'",
    "bcp47>=0.1.0; python_version>='3.11' and python_version<'3.14'",
    "cuda-bindings>=12.9,<13; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "cuda-python>=12.9,<13; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "cudf-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "cuml-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "pylibcugraph-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "pylibraft-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "raft-dask-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "rapidsmpf-cu12==25.10.*; python_version>='3.11' and platform_system=='Linux' and platform_machine=='x86_64'",
    "nemo-evaluator-launcher>=0.2.6,<0.3",
]

# Note: megatron-bridge is required for training but not listed as a dependency
# because it requires CUDA/nvcc to build. Install separately in GPU environments:
#   pip install megatron-bridge>=0.1.0

[project.urls]
Homepage = "https://github.com/nemotron/nemotron"
Documentation = "https://github.com/nemotron/nemotron#readme"
Repository = "https://github.com/nemotron/nemotron"

[project.scripts]
nemotron = "nemotron.__main__:main"

[project.entry-points."fsspec.specs"]
art = "nemo_runspec.filesystem:ArtifactFileSystem"

[project.entry-points."data_designer.plugins"]
persona-mcq = "nemotron.steps.sdg.plugins.persona_mcq.plugin:persona_mcq"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Allow ``nemo-run`` to be pulled from a fixed upstream Git revision.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron", "src/nemo_runspec"]
exclude = [
    "/src/nemotron/steps/curate/__local__/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: End-to-end tests that run real stage code with synthetic data",
    "gpu: Tests that require NVIDIA GPU and nemo_automodel",
    "docker: Tests that require Docker with NVIDIA runtime",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# These modules import PyYAML and jsonschema, neither of which ships inline types, and
# whose stub packages are not in the pinned dev environment. The note carries nothing
# beyond that fact, and left on it crowds out real findings in the BFCL MCP package.
module = [
    "nemotron.steps.byob.runtime.mcp.config",
    "nemotron.steps.byob.runtime.mcp.gateway.result_mapping",
    "nemotron.steps.byob.runtime.mcp.authoring.pack_artifacts",
    "nemotron.steps.byob.runtime.pack_authoring.pack_assembly",
    "nemotron.steps.byob.runtime.pack_authoring.runner",
]
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 119
target-version = "py311"
exclude = [
    "usage-cookbook",
    "use-case-examples",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.uv]
package = true
# mamba-ssm and causal-conv1d ship as sdists and import torch in setup.py
# without declaring it as a build dependency, so a build-isolated install
# fails with ModuleNotFoundError: No module named 'torch'.
extra-build-dependencies = { mamba-ssm = [{ requirement = "torch", match-runtime = true }], causal-conv1d = [{ requirement = "torch", match-runtime = true }] }
conflicts = [
    # Data Designer requires MCP SDK v1 while the 2026 BFCL gateway uses v2.
    # They communicate across the documented gateway process boundary.
    [{extra = "byob"}, {extra = "bfcl-mcp"}],
    [{extra = "data-sdg"}, {extra = "bfcl-mcp"}],
    [{extra = "all"}, {extra = "bfcl-mcp"}],
]
constraint-dependencies = [
    # Curator main currently keeps these constraints in its own uv config, but
    # they are not published transitively through package metadata.
    "transformers>=4.57.6,<5.0",
    "python-multipart>=0.0.29",
    "cryptography>=48.0.0",
    "gitpython>=3.1.50",
    "pytest>=9.0.3",
]
override-dependencies = [
    # data-designer-engine declares huggingface-hub>=1.0.1, while Curator's
    # Transformers-compatible stack requires the pre-1.0 API.
    "huggingface-hub>=0.34,<1.0",
    "torch==2.10.0",
    # torchx==0.7.0 still caps urllib3<1.27 through nemo-run. Force the
    # patched urllib3 line while we validate torchx/nemo-run compatibility.
    "urllib3>=2.7.0,<3",
]

[tool.nemotron.runtime.curate-gpu]
extras = ["curate-gpu"]
venv-name = "curate-gpu"
extra-index-urls = ["https://pypi.nvidia.com"]
required-imports = [
    "cudf",
    "huggingface_hub",
    "nemo_curator",
    "yaml",
]

[tool.nemotron.runtime.byob]
extras = ["byob"]
venv-name = "byob"
extra-index-urls = ["https://pypi.nvidia.com"]
omit-packages = ["nemo-curator"]
required-imports = [
    "bcp47",
    "cattrs",
    "data_designer",
    "datasets",
    "jinja2",
    "loguru",
    "nemo_curator",
    "numpy",
    "obstore",
    "pandas",
    "portpicker",
    "pulp",
    "pyarrow",
    "pydantic",
    "requests",
    "sacrebleu",
    "tabulate",
    "tqdm",
    "yaml",
]

[tool.nemotron.runtime.bfcl-mcp]
extras = ["bfcl-mcp"]
venv-name = "bfcl-mcp"
required-imports = [
    "mcp",
    "pydantic",
    "yaml",
]

[tool.nemotron.runtime.byob-gpu]
extras = ["byob", "byob-gpu"]
venv-name = "byob-gpu"
extra-index-urls = ["https://pypi.nvidia.com"]
torch-backend = "cu128"
omit-packages = ["nemo-curator"]
required-imports = [
    "bcp47",
    "cattrs",
    "data_designer",
    "datasets",
    "jinja2",
    "loguru",
    "nemo_curator",
    "numpy",
    "obstore",
    "pandas",
    "portpicker",
    "pulp",
    "pyarrow",
    "pydantic",
    "requests",
    "sacrebleu",
    "sentence_transformers",
    "sklearn",
    "tabulate",
    "tqdm",
    "yaml",
]
# RAPIDS imports can initialize CUDA libraries. Checking import specs verifies
# wheels are present without loading CUDA libraries during bootstrap readiness.
spec-only-imports = ["cudf", "cuml", "cupy"]

[tool.nemotron.runtime.translate]
extras = ["translate"]
venv-name = "translate"
extra-index-urls = ["https://pypi.nvidia.com"]
omit-packages = ["nemo-curator"]
required-imports = [
    "bcp47",
    "cattrs",
    "jinja2",
    "loguru",
    "nemo_curator",
    "obstore",
    "portpicker",
    "pulp",
    "pyarrow",
    "sacrebleu",
    "tabulate",
    "yaml",
]

[tool.nemotron.runtime.curate]
extras = ["curate"]
venv-name = "curate"
extra-index-urls = ["https://pypi.nvidia.com"]
required-imports = [
    "cosmos_xenna",
    "huggingface_hub",
    "nemo_curator",
    "yaml",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
run = [
    "nemo-run @ git+https://github.com/NVIDIA-NeMo/Run.git@a8425c9f11a45412e6d5338cecb1c014b0ecc0c4",
]
docs = [
    "myst-parser>=4.0.1",
    "nvidia-sphinx-theme>=0.0.8",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.0",
    "sphinxcontrib-mermaid",
    "sphinx-reredirects",
]
