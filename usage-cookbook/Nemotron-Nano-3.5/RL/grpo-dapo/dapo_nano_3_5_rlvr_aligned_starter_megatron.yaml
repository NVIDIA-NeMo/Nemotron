# One-node Nemotron Nano 3.5 DAPO starter aligned with the large-scale RLVR
# recipe where that is compatible with colocated EP4 Megatron training.
#
# Deliberate one-node differences from rlvr.yaml:
# - Training uses TP=1, EP=4, CP=1; colocated vLLM uses TP=4 across the
#   same four GPUs (rather than TP=4, EP=16, CP=4 and separate generation
#   workers).
# - 4K total sequence length / 2K generated tokens and DAPOMath17K rewards.
# - This starter uses the FlashInfer CUTLASS backend from rlvr.yaml. The
#   baseline run intentionally exercises upstream main's CUDA-IPC refit path.
# - MTP remains disabled because this is a policy-only DAPO starter.
defaults: dapo_nano_3_5_starter_megatron.yaml

grpo:
  # Preserve the one-node batch size, but use the RLVR estimator behavior.
  num_prompts_per_step: 2
  num_generations_per_prompt: 8
  use_leave_one_out_baseline: true
  advantage_clip_low: -20
  advantage_clip_high: 20
  use_dynamic_sampling: false
  batch_multiplier: 1
  overlong_filtering: false
  reward_shaping:
    enabled: false
  reward_scaling:
    enabled: false

loss_fn:
  # Match the RLVR importance-sampling behavior.
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: null
  kl_input_clamp_value: null
  kl_output_clamp_value: null
  truncated_importance_sampling_ratio: 5
  truncated_importance_sampling_ratio_min: 0.2
  truncated_importance_sampling_type: tis
  force_on_policy_ratio: true

policy:
  # Short-context single-node scale-down of the RLVR values.
  train_global_batch_size: 16
  train_micro_batch_size: 1
  generation_batch_size: 32
  max_total_sequence_length: 4096
  max_grad_norm: 1.0

  megatron_cfg:
    # Retain the tested one-node EP4 topology from the base starter.
    tensor_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 4
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: false
    empty_unused_memory_level: 2

    # RLVR MoE/router and optimizer settings that are topology-independent.
    freeze_moe_router: true
    moe_router_dtype: fp32
    moe_router_load_balancing_type: none
    moe_router_bias_update_rate: 1.0e-3
    moe_router_enable_expert_bias: true
    moe_permute_fusion: true
    moe_token_dispatcher_type: alltoall
    moe_shared_expert_overlap: false
    track_moe_metrics: true
    moe_per_layer_logging: true

    optimizer:
      lr: 4.0e-6
      min_lr: 4.0e-6
      weight_decay: 0.0
      clip_grad: ${policy.max_grad_norm}

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: constant
      lr_decay_style: constant
      lr_decay_iters: null
      lr_warmup_iters: 10
      lr_warmup_init: 4.0e-7
      override_opt_param_scheduler: true

  sequence_packing:
    enabled: true
    train_mb_tokens: 4096
    logprob_mb_tokens: 4096
    sequence_length_round: 64
    fuse_loss: true

  generation:
    # Keep the DAPO short rollout length while matching the safe refit path.
    max_new_tokens: 2048
    vllm_cfg:
      enforce_eager: true
    vllm_kwargs:
      moe_backend: flashinfer_cutlass

checkpointing:
  checkpoint_dir: /shared/results/dapo_nano_3_5_rlvr_aligned_starter_megatron
  metric_name: train:reward
  save_period: 10
  keep_top_k: 3

logger:
  log_dir: /shared/logs/dapo_nano_3_5_rlvr_aligned_starter_megatron
  wandb:
    project: dapo-nano-3-5-megatron
    name: dapo-nano-3-5-rlvr-aligned-starter-megatron
