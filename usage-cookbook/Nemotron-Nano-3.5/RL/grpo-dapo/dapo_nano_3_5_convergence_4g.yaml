# Four-GPU convergence test derived from the Nano 3.5 DAPO starter.
# This preserves the GB200 node topology while following PR #3383's cadence:
# validation at startup and every ten steps, dynamic sampling, and checkpoints.
defaults: dapo_nano_3_5_starter.yaml

grpo:
  max_num_steps: 20
  val_at_start: true
  val_at_end: true
  val_period: 10
  val_batch_size: 32
  max_val_samples: 32
  use_dynamic_sampling: true
  batch_multiplier: 3
  dynamic_sampling_max_gen_batches: 10
  overlong_filtering: true
  num_prompts_per_step: 4
  num_generations_per_prompt: 4

policy:
  train_global_batch_size: 16
  generation:
    max_new_tokens: 2048
  dtensor_cfg:
    # Four local ranks use the starter's EP=4 topology.  PR #3383 uses the
    # distinct 32-rank TP=4, EP=8 mesh; it cannot be faithfully reduced to
    # four ranks because the colocated vLLM refit layouts are incompatible.
    expert_parallel_size: 4
    automodel_kwargs:
      backend:
        # The 32-GPU PR enables DeepEP. On this four-GPU colocated test it
        # exhausts Ray's GPU placement group before vLLM can start.
        enable_deepep: false

checkpointing:
  enabled: true
  checkpoint_dir: /shared/results/dapo_nano_3_5_convergence_4g
  save_period: 10
  keep_top_k: 3

logger:
  log_dir: /shared/logs/dapo_nano_3_5_convergence_4g
  tensorboard_enabled: true
  monitor_gpus: true
  wandb_enabled: false
