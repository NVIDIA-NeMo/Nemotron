# Nemotron 3.5 Super VL full-weight GRPO with NeMo Gym circle-count rewards.
#
# This recipe evaluates the untouched model at step 0, then evaluates after
# steps 5, 10, and 15. It inherits the Super VL Megatron implementation from
# the pinned NeMo RL container and overrides the complete tested 4x4 topology.
defaults: /opt/nemo-rl/examples/configs/recipes/vlm/vlm_grpo-nemotron-super-omni-120ba12b-16n8g-megatron-tp8ep16cp2-async-gym.v1.yaml

cluster:
  num_nodes: 4
  gpus_per_node: 4

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 2
  val_num_generations_per_prompt: 1
  max_num_epochs: 10
  max_num_steps: 15
  val_period: 5
  val_at_start: true
  val_at_end: true
  # NeMo Gym evaluates the validation JSONL exactly as provided.
  max_val_samples: null
  stop_at_validation_metric: null
  stop_at_validation_threshold: null
  async_grpo:
    enabled: false

# A full-weight checkpoint is hundreds of GB. Enable this only when the run
# needs a resumable artifact; evaluation and W&B metrics do not require it.
checkpointing:
  enabled: false
  checkpoint_dir: /shared/runs/super35-circle-count/checkpoints

policy:
  model_name: /shared/models/NVIDIA-Nemotron-3.5-Super-VL-09212026
  train_global_batch_size: 16
  max_total_sequence_length: 4096
  offload_optimizer_for_refit: false
  megatron_cfg:
    tensor_model_parallel_size: 4
    expert_model_parallel_size: 16
    context_parallel_size: 1
    freeze_vision_model: false
    freeze_vision_projection: false
    checkpoint:
      async_save: false
    optimizer:
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
      overlap_cpu_optimizer_d2h_h2d: false
    env_vars:
      CUDA_LAUNCH_BLOCKING: '0'
  generation:
    max_new_tokens: 256
    val_temperature: 0.0
    val_top_p: 1.0
    vllm_cfg:
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.4
      enforce_eager: true
      reset_encoder_cache_after_weight_update: true
    vllm_kwargs:
      max_num_batched_tokens: 4096
      max_num_seqs: 4
    colocated:
      enabled: true
      resources:
        gpus_per_node: 4
        num_nodes: 4

data:
  shuffle: false
  train:
    data_path: /shared/runs/super35-circle-count/data/train.jsonl
  validation:
    data_path: /shared/runs/super35-circle-count/data/validation.jsonl

env:
  nemo_gym:
    policy_max_input_tokens: ${policy.max_total_sequence_length}
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/circle_count/configs/circle_count.yaml

logger:
  log_dir: /shared/runs/super35-circle-count/logs
  wandb_enabled: true
  tensorboard_enabled: false
  monitor_gpus: true
  wandb:
    project: nemotron-super-vl-35-circle-count
    name: megatron-grpo-step0-15
    log_nemo_gym_full_result_tables: false
