# Nemotron 3.5 Super VL full-weight GRPO on a variable-resolution star task.
# Validated on the NVIDIA-NeMo/RL super-v3.5-posttraining branch.
defaults: /opt/nemo-rl/examples/configs/recipes/vlm/vlm_grpo-nemotron-super-omni-120ba12b-16n8g-megatron-tp8ep16cp2-async-gym.v1.yaml

cluster:
  num_nodes: 4
  gpus_per_node: 4

grpo:
  # Each update contains 16 prompts x 8 independently sampled responses.
  num_prompts_per_step: 16
  num_generations_per_prompt: 8
  val_num_generations_per_prompt: 1
  # Ten steps consume 160 prompts, so one 1,024-row epoch is sufficient.
  max_num_epochs: 1
  max_num_steps: 10
  normalize_rewards: true
  use_leave_one_out_baseline: true
  reward_shaping:
    enabled: false
  reward_scaling:
    enabled: false
  val_period: 2
  val_at_start: true
  val_at_end: true
  max_val_samples: null
  stop_at_validation_metric: null
  stop_at_validation_threshold: null
  async_grpo:
    enabled: false

checkpointing:
  enabled: false
  checkpoint_dir: /shared/runs/super35-star-count/checkpoints

policy:
  model_name: /shared/models/NVIDIA-Nemotron-3.5-Super-VL-09212026
  train_global_batch_size: 128
  max_total_sequence_length: 4096
  # Free optimizer state while gathering full TP weights for the colocated
  # vLLM refit. Four nodes provide enough host memory for the temporary offload.
  offload_optimizer_for_refit: true
  megatron_cfg:
    tensor_model_parallel_size: 4
    expert_model_parallel_size: 16
    context_parallel_size: 1
    freeze_vision_model: false
    freeze_vision_projection: false
    checkpoint:
      async_save: false
    optimizer:
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
      overlap_cpu_optimizer_d2h_h2d: false
    env_vars:
      CUDA_LAUNCH_BLOCKING: '0'
  generation:
    max_new_tokens: 256
    val_temperature: 0.0
    val_top_p: 1.0
    vllm_cfg:
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.4
      enforce_eager: true
      reset_encoder_cache_after_weight_update: true
      env_vars:
        # Discard stale rollout weights while vLLM sleeps. The following refit
        # writes the current policy weights before generation resumes.
        NRL_VLLM_SLEEP_LEVEL: '2'
    vllm_kwargs:
      max_num_batched_tokens: 4096
      max_num_seqs: 4
    colocated:
      enabled: true
      resources:
        gpus_per_node: 4
        num_nodes: 4

data:
  # The reference curve used the first 160 rows in deterministic seed order.
  # Enable shuffling for broader sampling in longer or comparative runs.
  shuffle: false
  train:
    data_path: /shared/runs/super35-star-count/data/train.jsonl
  validation:
    data_path: /shared/runs/super35-star-count/data/validation.jsonl

env:
  nemo_gym:
    policy_max_input_tokens: ${policy.max_total_sequence_length}
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/circle_count/configs/circle_count.yaml

logger:
  log_dir: /shared/runs/super35-star-count/logs
  wandb_enabled: true
  tensorboard_enabled: false
  monitor_gpus: true
  wandb:
    project: nemotron-super-vl-35-star-count
    name: fullweight-grpo-16x8-step0-10
    log_nemo_gym_full_result_tables: false
