# Runtime source: the commit-pinned AutoModel dependency in pyproject.toml's vl extra.

recipe: TrainBiEncoderRecipe
seed: 42
temperature: 0.02

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 500
  val_every_steps: 500
  num_epochs: 1

model:
  _target_: nemo_automodel.NeMoAutoModelBiEncoder.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512-BF16
  pooling: avg
  l2_normalize: true
  is_causal: false
  use_liger_kernel: true
  use_sdpa_patching: true
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  do_distributed_inbatch_negative: false  # EA: unrolled positives are not masked across queries.
  detach_distributed_inbatch_negatives: false

tokenizer:
  _target_: nemo_automodel.components.models.ministral_bidirectional.processor.Mistral3BiEncoderProcessor.from_pretrained
  pretrained_model_name_or_path: mistralai/Ministral-3-3B-Instruct-2512-BF16
  q_max_length: 512
  p_max_length: 4096
  pad_to_multiple_of: 8

dataset:
  _target_: nemotron.recipes.retrieval_vl.DataDesignerRetrievalDatasetConfig
  model_type: bi_encoder
  data_dir_list:
    - training_datasets/train.json
  data_type: train
  n_passages: 4
  seed: 42
  use_text_in_document: false

dataloader:
  collate_fn:
    _target_: nemo_automodel.components.datasets.llm.ProcessorMethodCollator
    collator_fn_name: process_queries_documents_biencoder
  shuffle: true
  num_workers: 4
  pin_memory: true

optimizer:
  _target_: transformer_engine.pytorch.optimizers.fused_adam.FusedAdam
  lr: 2.0e-6
  weight_decay: 0.01
  adam_w_mode: true
  bias_correction: true
  master_weights: true

lr_scheduler:
  lr_warmup_steps: 100
  lr_decay_style: linear

checkpoint:
  enabled: true
  checkpoint_dir: ./output/mistral3_vl_embedding/checkpoints
  model_save_format: safetensors
  save_consolidated: true
  # Keep the latest checkpoint plus any pointer-protected best checkpoint.
  max_recent_checkpoints: 1

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  activation_checkpointing: true
  activation_checkpointing_scope: all
