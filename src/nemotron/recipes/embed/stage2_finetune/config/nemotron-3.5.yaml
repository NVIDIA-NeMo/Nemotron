# Fine-tuning profile for Nemotron 3.5 Embed 1B.
# Uses the commit-pinned AutoModel dependency in the stage's vl extra.
# NEMOTRON_3_5_TRAIN_DATA points to the scored hard-negative output from Stage 1.

run:
  env:
    container: nvcr.io/nvidia/nemo-automodel:26.06

artifact_root: ./output/embed/nemotron-3.5
model_family: nemotron_3_5
base_model: ${oc.env:NEMOTRON_3_5_EMBED_MODEL,nvidia/Nemotron-3.5-Embed-1B-BF16}
trust_remote_code: false
train_data_path: ${oc.env:NEMOTRON_3_5_TRAIN_DATA,${artifact_root}/stage1_data_prep/train_mined.automodel_unrolled.json}
checkpoint_dir: ${artifact_root}/stage2_finetune/checkpoints

num_epochs: 1
global_batch_size: 8
local_batch_size: 1
learning_rate: 2.0e-6
lr_warmup_steps: 100
lr_decay_style: linear
weight_decay: 0.01
optimizer_backend: flash_adamw
flash_adamw_master_weight_bits: 32

attn_implementation: sdpa
train_n_passages: 4
pooling: avg
l2_normalize: true
temperature: 0.02
is_causal: false
do_distributed_inbatch_negative: false  # Unrolled positives are not masked across queries.
detach_distributed_inbatch_negatives: false

query_max_length: 512
passage_max_length: 4096
query_prefix: null
passage_prefix: null
image_longest_edge: null
pad_to_multiple_of: 8
use_text_in_document: true
require_mined_negatives: true

checkpoint_every_steps: 500
val_every_steps: 500
auto_scale_checkpoint_intervals: false
