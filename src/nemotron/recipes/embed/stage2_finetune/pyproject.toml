[project]
name = "recipe-runner"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "omegaconf>=2.3.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.10.0,<2.11.0",
    # AutoModel metric logging imports wandb even when hosted logging is disabled.
    "wandb>=0.21,<1",
]

[project.optional-dependencies]
text = ["nemo-automodel", "transformers==5.18.0"]
vl = ["nemo-automodel", "transformers==5.18.0", "torchvision>=0.25,<0.26"]

[tool.uv]
conflicts = [[{ extra = "text" }, { extra = "vl" }]]

[tool.uv.sources]
nemo-automodel = [
    { url = "https://github.com/NVIDIA-NeMo/Automodel/archive/497b995339e234fc492368e8c470669a04cdb9b7.tar.gz", extra = "text" },
    { url = "https://github.com/NVIDIA-NeMo/Automodel/archive/497b995339e234fc492368e8c470669a04cdb9b7.tar.gz", extra = "vl" },
]
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin' and sys_platform != 'linux'" },
]
torchvision = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.nemotron]
entry-point = "train.py"
container-extras = ["text"]
container-exclude-dependencies = [
    "torch", "torchao", "torchvision", "flash-attn", "triton", "pyarrow", "scipy", "opencv-python-headless",
]
