[project]
name = "recipe-runner"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "omegaconf>=2.3.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.10.0,<2.11.0",
    # AutoModel metric logging imports wandb even when hosted logging is disabled.
    "wandb>=0.21,<1",
]

[project.optional-dependencies]
text = ["nemo-automodel", "transformers==5.12.1"]
vl = ["nemo-automodel", "transformers==5.15.1", "torchvision>=0.25,<0.26"]

[tool.uv]
conflicts = [[{ extra = "text" }, { extra = "vl" }]]

[tool.uv.sources]
nemo-automodel = [
    { url = "https://github.com/NVIDIA-NeMo/Automodel/archive/a9f4423819c513fd08083324fe1f738746ac6e54.tar.gz", extra = "text" },
    { url = "https://github.com/NVIDIA-NeMo/Automodel/archive/aa6245acfcf129b22d83e815817e1560b10064c7.tar.gz", extra = "vl" },
]
torch = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.nemotron]
entry-point = "train.py"
container-extras = ["text"]
container-exclude-dependencies = [
    "torch", "torchao", "torchvision", "flash-attn", "triton", "pyarrow", "scipy", "opencv-python-headless",
]
