[project]
name = "recipe-runner-embed-text-finetune"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nemo-automodel",
    "transformers==5.12.1",
    "omegaconf>=2.3.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.10.0",
]

# Preserve the text recipe's pre-VL source and Transformers requirements.
[tool.uv.sources]
nemo-automodel = { url = "https://github.com/NVIDIA-NeMo/Automodel/archive/a9f4423819c513fd08083324fe1f738746ac6e54.tar.gz" }
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin' and sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
