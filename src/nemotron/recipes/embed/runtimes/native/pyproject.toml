[project]
name = "recipe-runner-embed-native"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nemo-automodel==0.7.0+aa6245ac",
    "transformers==5.15.1",
    "torch>=2.10,<2.11",
    "torchvision>=0.25,<0.26",
    "omegaconf>=2.3",
    "wandb>=0.21,<1",
    "pydantic-settings>=2",
    "sentence-transformers>=3",
    "faiss-cpu>=1.7.4",
    "beir>=2",
    "data-designer-retrieval-sdg==0.2.1",
    "data-designer==0.9.1+barejson.1",
    "data-designer-config==0.9.1+barejson.1",
    "data-designer-engine==0.9.1+barejson.1",
]

# Draft source builds are explicit artifacts, never ambient editable installs.
# Build the wheels from the reviewed checkouts before syncing this project.
[tool.uv.sources]
nemo-automodel = { path = "../wheels/nemo_automodel-0.7.0+aa6245ac-py3-none-any.whl" }
data-designer-retrieval-sdg = { path = "../wheels/plugin-aa6c9652/data_designer_retrieval_sdg-0.2.1-py3-none-any.whl" }
data-designer = { path = "../wheels/data_designer-0.9.1+barejson.1-py3-none-any.whl" }
data-designer-config = { path = "../wheels/data_designer_config-0.9.1+barejson.1-py3-none-any.whl" }
data-designer-engine = { path = "../wheels/data_designer_engine-0.9.1+barejson.1-py3-none-any.whl" }
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
