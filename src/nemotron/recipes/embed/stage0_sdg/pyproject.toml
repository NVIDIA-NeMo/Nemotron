[project]
name = "recipe-runner-sdg"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "data-designer-retrieval-sdg[multimodal]",
    # Released core; the public plugin owns strict structured-response parsing.
    "data-designer==0.9.1",
    "omegaconf>=2.3.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv.sources]
data-designer-retrieval-sdg = { git = "https://github.com/NVIDIA-NeMo/DataDesignerPlugins.git", rev = "a8c509a313a3c2169dacdacaeeb186e37173bedf", subdirectory = "plugins/data-designer-retrieval-sdg" }

[tool.nemotron]
entry-point = "data_prep.py"
container-exclude-dependencies = [
    "torch", "torchvision", "flash-attn", "triton", "pyarrow", "scipy", "opencv-python-headless",
]
