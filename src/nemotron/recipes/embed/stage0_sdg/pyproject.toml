[project]
name = "recipe-runner-sdg"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "data-designer-retrieval-sdg",
    # Released core only: bare-JSON response parsing remains a documented blocker.
    "data-designer==0.9.1",
    "omegaconf>=2.3.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv.sources]
data-designer-retrieval-sdg = { git = "https://github.com/NVIDIA-NeMo/DataDesignerPlugins.git", rev = "c2871e19b668f2d9c2f8d5e9eadbc76f582b288e", subdirectory = "plugins/data-designer-retrieval-sdg" }

[tool.nemotron]
entry-point = "data_prep.py"
container-exclude-dependencies = [
    "torch", "torchvision", "flash-attn", "triton", "pyarrow", "scipy", "opencv-python-headless",
]
