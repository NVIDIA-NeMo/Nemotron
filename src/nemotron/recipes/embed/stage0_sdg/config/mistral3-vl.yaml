# Preview synthetic-data profile for canonical text/image retrieval sources.
# The reviewed plugin and Data Designer core patch are supplied by the local
# Stage 0 wheel project; remote execution fails before submission.

run:
  env:
    container: nvcr.io/nvidia/pytorch:26.06-py3

artifact_root: ./output/embed/mistral3-vl-preview
corpus_id: multimodal_retrieval
sources_file: null
portable_export: true
export_train_ratio: 0.8
export_validation_ratio: 0.0
export_seed: 42
strict_visual: false
output_dir: ${artifact_root}/stage0_sdg
artifact_path: ${artifact_root}/stage0_sdg/artifacts
dataset_name: multimodal_retrieval
resume: never
preview: false

# Explicit hosted model identities are required for the multimodal path.
artifact_extraction_model: ${oc.env:MISTRAL3_SDG_ARTIFACT_MODEL}
qa_generation_model: ${oc.env:MISTRAL3_SDG_QA_MODEL}
quality_judge_model: ${oc.env:MISTRAL3_SDG_JUDGE_MODEL}
embed_model: ${oc.env:MISTRAL3_SDG_EMBED_MODEL}
