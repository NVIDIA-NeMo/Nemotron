[project]
name = "recipe-runner-data-prep"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "data-designer-retrieval-sdg",
    "data-designer==0.9.1",
    "omegaconf>=2.3.0",
    "pydantic-settings>=2.0.0",
    "torch>=2.10.0,<2.11.0",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.7.4",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
# Preserve the original checkpoint's pre-5.6 bidirectional-mask API.
text = ["nemo-automodel==0.4.0", "transformers>=5.1,<5.6"]
vl = ["nemo-automodel", "transformers==5.15.1", "torchvision>=0.25,<0.26"]

[tool.uv]
conflicts = [[{ extra = "text" }, { extra = "vl" }]]

[tool.uv.sources]
data-designer-retrieval-sdg = { git = "https://github.com/NVIDIA-NeMo/DataDesignerPlugins.git", rev = "81037157f8e71272f339603e33b4daf8f39b712e", subdirectory = "plugins/data-designer-retrieval-sdg" }
nemo-automodel = { url = "https://github.com/NVIDIA-NeMo/Automodel/archive/0e02c4274d09e7e09159009916f7348fcb7dc9bb.tar.gz", extra = "vl" }
torch = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu129", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.nemotron]
entry-point = "data_prep.py"
container-extras = ["text"]
container-exclude-dependencies = [
    "torch", "torchvision", "flash-attn", "triton", "scipy", "opencv-python-headless",
]
