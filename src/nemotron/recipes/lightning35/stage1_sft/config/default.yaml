run:
  data: lightning35-sft-data:latest
  model: lightning35-pretrain-model:latest
  env:
    # 26.08 container generation (has the Lightning stack); the public
    # nvcr.io/nvidia/nemo:26.08 tag publishes at launch — switch then.
    container: nvcr.io/nvidian/nemo:26.08.rc2
    # FlashInfer JIT cache must live on a writable mount — the container's
    # /root/.cache overlay is tiny and import fails with ENOSPC otherwise
    # (same fix as super3 RL's persistent cache mapping).
    env_vars:
      FLASHINFER_WORKSPACE_BASE: /nemo_run/cache/flashinfer_workspace
      FLASHINFER_CUBIN_DIR: /nemo_run/cache/flashinfer_cubins
      # Triton/Inductor JIT caches also default under /root — use node-local /tmp
      TRITON_CACHE_DIR: /tmp/triton_cache
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor_cache
      TILELANG_CACHE_DIR: /tmp/tilelang_cache
      TORCH_EXTENSIONS_DIR: /tmp/torch_extensions
      XDG_CACHE_HOME: /tmp/xdg_cache
    mounts:
      - ${auto_mount:git+https://github.com/NVIDIA-NeMo/Megatron-Bridge.git@0c565c9a063bc8578ec094b4eb488594ed8b033a,/opt/Megatron-Bridge}
      # megatron.core resolves from MB's vendored submodule path in this
      # container; a bare MB clone leaves 3rdparty/ empty, so mount the
      # revision MB main pins into it.
      - ${auto_mount:git+https://github.com/NVIDIA/Megatron-LM.git@d12f6c8c9aff51e166d872fd70151687a8e3f375,/opt/Megatron-Bridge/3rdparty/Megatron-LM}

# Zero-argument recipe on MB main; packed-sequence consumption is configured
# via the dataset section below, and full SFT is the recipe's default.
recipe:
  _target_: megatron.bridge.recipes.nemotronh.nemotron_3_5_lightning_sft_config

# Dataset config for packed Parquet shards from data_prep
# train.py builds FinetuningDatasetConfig directly (not HFDatasetConfig) to skip HF download
# Uses lightning35_packed_sft_dir for seamless config - auto-resolves to splits/train/ and splits/valid/
dataset:
  lightning35_packed_sft_dir: ${art:data,path}
  seq_length: ${art:data,pack_size}
  packed_sequence_specs:
    packed_sequence_size: ${art:data,pack_size}
    # packed_train_data_path and packed_val_data_path auto-resolve from lightning35_packed_sft_dir
    # Explicit paths can still be set to override:
    # packed_train_data_path: /path/to/splits/train/
    # packed_val_data_path: /path/to/splits/valid/

# Training/model settings mirror MB main's verified packed SFT recipe
# (nemotron_3_5_lightning_sft_openmathinstruct2_packed_config), with the
# dataset swapped for the packed-parquet artifact above. Architecture comes
# entirely from the recipe — do not override geometry here.
train:
  train_iters: 100
  global_batch_size: 128
  micro_batch_size: 1

model:
  seq_length: ${art:data,pack_size}
  tensor_model_parallel_size: 2
  sequence_parallel: true
  expert_tensor_parallel_size: 1
  expert_model_parallel_size: 8
  pipeline_model_parallel_size: 1
  recompute_granularity: selective
  recompute_modules: [moe, layernorm, core_attn, mlp]

optimizer:
  lr: 5.0e-6
  min_lr: 0.0

scheduler:
  lr_warmup_iters: 10
  lr_decay_iters: 100

logger:
  log_interval: 10
  wandb_project: ${run.wandb.project}   # Set from env.toml [wandb]
  wandb_entity: ${run.wandb.entity}     # Set from env.toml [wandb]
  wandb_exp_name: lightning35-sft             # Experiment name shown in wandb UI

checkpoint:
  save: /nemo_run/lightning35-sft-model
  save_interval: 20
  pretrained_checkpoint: ${art:model,path}
  finetune: true  # Skip loading optimizer state from pretrained checkpoint
  # ckpt_step: ${art:model,iteration}  # Optional: set to load specific iteration from artifact
