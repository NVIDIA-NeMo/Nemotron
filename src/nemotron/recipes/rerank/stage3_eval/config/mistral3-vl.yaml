# Preview endpoint evaluation profile for Mistral3 VL reranking.
# first_stage_results_path must contain scores emitted by the Embed VL evaluator.

run:
  env:
    container: nvcr.io/nvidia/pytorch:26.06-py3

base_model: ${oc.env:MISTRAL3_VL_RERANK_MODEL}
finetuned_model_path: ./output/rerank/mistral3-vl-preview/stage2_finetune/checkpoints/LATEST/model/consolidated
retrieval_model: ${oc.env:MISTRAL3_VL_EMBED_MODEL}
first_stage_results_path: ${oc.env:MISTRAL3_VL_FIRST_STAGE_RESULTS,./output/embed/mistral3-vl-preview/stage3_eval/retrieval_results.json}

eval_data_path: ${oc.env:MISTRAL3_VL_EVAL_DATA,./output/rerank/mistral3-vl-preview/stage1_prep/text_image/eval_beir}
output_dir: ./output/rerank/mistral3-vl-preview/stage3_eval
k_values: [1, 5, 10, 100]
top_k: 100
batch_size: 4
retrieval_batch_size: 4
max_length: 8192
corpus_chunk_size: 50000
retrieval_normalize: true
query_prefix: "query:"
passage_prefix: "passage:"
prompt_template: "question:{query} \n \n passage:{passage}"

eval_base: false
eval_finetuned: false
eval_nim: true
rerank_api_backend: vllm
nim_url: ${oc.env:MISTRAL3_VL_RERANK_URL,http://localhost:8000}
nim_model: ${oc.env:MISTRAL3_VL_RERANK_MODEL}
nim_batch_size: 4
nim_timeout: 300
nim_truncate: END
