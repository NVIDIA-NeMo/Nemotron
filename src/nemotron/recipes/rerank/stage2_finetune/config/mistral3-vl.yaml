# Preview profile for Mistral3 VL reranking.
# Requires the reviewed public AutoModel source build described in the embedding runtime README.
# MISTRAL3_VL_TRAIN_DATA points to the scored hard-negative output from Stage 1.

run:
  env:
    container: nvcr.io/nvidia/nemo-automodel:26.06

model_family: mistral3_vl
base_model: ${oc.env:MISTRAL3_VL_RERANK_MODEL}
allow_untrusted_remote_code: false
train_data_path: ${oc.env:MISTRAL3_VL_TRAIN_DATA,./output/rerank/mistral3-vl-preview/stage1_prep/train_mined.automodel_unrolled.json}
checkpoint_dir: ./output/rerank/mistral3-vl-preview/stage2_finetune/checkpoints

num_epochs: 1
global_batch_size: 8
local_batch_size: 1
learning_rate: 2.0e-6
lr_warmup_steps: 100
lr_decay_style: linear
weight_decay: 0.01
optimizer_backend: auto
flash_adamw_master_weight_bits: 32

attn_implementation: flash_attention_2
train_n_passages: 4
num_labels: 1
temperature: 0.02
recipe_temperature: 1.0
pooling: avg
is_causal: false

rerank_max_length: 4096
prompt_template: "question:{query} \n \n passage:{passage}"
use_prompt_template: true
export_as_stock_processor: false
image_longest_edge: 1120
pad_to_multiple_of: 8
use_text_in_document: true
require_mined_negatives: true

checkpoint_every_steps: 500
val_every_steps: 500
