[project]
name = "recipe-runner"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nemo-automodel",
  # Mistral3 VL retrieval support comes from the reviewed public source below.
  "transformers==5.15.1",
  # Needed by Nemotron library (added via --with flag)
  "omegaconf>=2.3.0",
  "pydantic-settings>=2.0.0",
  # Local GPU torch wheel, sourced from PyTorch cu130 index on Linux below
  "torch>=2.10.0,<2.11.0",
  # Required by PixtralImageProcessor for Mistral 3 VL inputs.
  "torchvision>=0.25.0,<0.26.0",
]

# Note: exclude-dependencies are injected dynamically by run_uv.py for Docker/Slurm
# This base config works for local mode where all packages need to be installed

# Pin Linux torch installs to cu130 to match the reviewed AutoModel source.
[tool.uv.sources]
nemo-automodel = { git = "https://github.com/NVIDIA-NeMo/Automodel.git", rev = "4c50ab3c4c033f9e3f43b494b20bd88fe51b6b7f" }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin' and sys_platform != 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'darwin' and sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.nemotron]
entry-point = "train.py"
container-exclude-dependencies = [
    "torch",
    "torchao",
    "torchvision",
    "flash-attn",
    "triton",
    "pyarrow",
    "scipy",
    "opencv-python-headless",
]
