# Preview deployment profile for Mistral3 VL reranking.
# There is no NIM for this checkpoint; vLLM is the only supported backend.

model_family: mistral3_vl
backend: vllm
nim_image: nvcr.io/nim/nvidia/llama-nemotron-rerank-1b-v2:1.10.0
vllm_image: nvcr.io/nvidia/vllm:26.06-py3
served_model_name: ${oc.env:MISTRAL3_VL_RERANK_MODEL}
vllm_runner: pooling
vllm_max_model_len: 8192
vllm_trust_remote_code: false
vllm_enforce_eager: true

container_name: mistral3-vl-rerank
replace_existing: false
model_dir: ${oc.env:MISTRAL3_VL_RERANK_DEPLOY_CHECKPOINT,./output/rerank/mistral3-vl-preview/stage2_finetune/checkpoints/LATEST/model/consolidated}
container_model_path: /model
container_cache_path: /opt/nim/.cache
vllm_container_cache_path: /root/.cache/huggingface

bind_address: 127.0.0.1
host_port: 8000
container_port: 8000
gpus: all
shm_size: 16gb
container_user: ""

detach: false
remove_on_exit: true
keep_failed_container: false
health_check_timeout: 600
health_check_interval: 5
ngc_api_key_env: NGC_API_KEY
