# Nemotron 3.5 Super VL -- RL stage 2 teacher: vision-reasoning, stage 2 of 2.
#
# Native policy-weights warm start from the stage-1 teacher (step 114): fresh
# optimizer, dataloader and step counter -- NOT an optimizer/replay resume.
# run.model is the stage-1 checkpoint (policy.pretrained_checkpoint); the RLVR
# HF checkpoint (run.base_model) still supplies architecture, tokenizer and the
# frozen vision weights. Trains on a new visual-reasoning blend with a
# structured-answer verifier (sets / ordered lists / intervals) in string_match.
# TP2/CP2/EP16 with Ray router replay. Selected checkpoint: step 20. Used in MOPD phase 2.
#
# Nodes (GB200, 4 GPUs/node): 16 training + 16 generation. 256 prompts x 16
# generations, 32K context, frozen vision encoder/projector, shuffled data.
# vLLM uses load_format=auto (not dummy) because frozen vision weights are never
# refitted, so they must be loaded from the HF checkpoint at startup.
# Deviation: five repeated detached MTP heads trained with coefficient 0.3
# (historically 5/0.1 in stage 1 and disabled in stage 2); no speculative decoding.
# The reference deployment added a dedicated Ray head node (33 nodes total).
# Requires NeMo-RL super-v3.5-posttraining @ f299847f1 (Gym e24db4e6); see ../../../Dockerfile.
# Several keys below (reward_penalties, router_replay, ...) only exist on that branch.

run:
  model: super35-rl-teacher-vision-reasoning-stage1-model:latest
  base_model: super35-rl-rlvr-model:latest  # HF architecture/tokenizer/frozen vision
  data: super35-rl-teacher-vision-reasoning-data:latest
  output_artifact: super35-rl-teacher-vision-reasoning-model
  hf_architecture: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
  env:
    container: /home/${oc.env:USER}/.cache/nemotron/containers/super35-rl.sqsh
    nodes: 33  # Slurm allocation: 16 training + 16 generation + 1 dedicated Ray head (cluster.num_nodes stays 32)
    gpus_per_node: 4
    persistent_cache: ""  # Shared dir for vLLM/Triton/Inductor caches
    env_vars:
      NRL_WG_USE_RAY_REF: "1"
      OMP_NUM_THREADS: "16"
      RAY_ENABLE_UV_RUN_RUNTIME_ENV: "0"
      UV_HTTP_TIMEOUT: "10"
      UV_LOCK_TIMEOUT: "1800"
      WANDB_INIT_TIMEOUT: "300"
      VLLM_USE_FLASHINFER_MOE_FP8: "1"
      VLLM_FLASHINFER_MOE_BACKEND: "latency"
      NEMO_GYM_VENV_DIR: "/opt/gym_venvs"
      NRL_VLLM_ASYNC_TIMEOUT_SECONDS: "1800"
      NRL_IGNORE_VERSION_MISMATCH: "1"
      NRL_USE_FASTOKENS: "0"
      RAY_DEDUP_LOGS: "1"
      PYTHONPATH: "/opt/nemo-rl:/opt/nemo-rl/3rdparty/Gym-workspace/Gym:/opt/nemo-rl/3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/src:/opt/nemo-rl/3rdparty/Megatron-Bridge-workspace/Megatron-Bridge/3rdparty/Megatron-LM"
      MIMALLOC_PURGE_DELAY: "0"
      MIMALLOC_PURGE_DECOMMITS: "1"
checkpointing:
  checkpoint_dir: results/super35-rl-teacher-vision-reasoning/checkpoints
  checkpoint_must_save_by: null
  enabled: true
  higher_is_better: true
  keep_top_k: 20
  load_replay_buffer: false
  metric_name: null
  save_optimizer: true
  save_period: 10
cluster:
  gpus_per_node: 4
  master_port_range_high: 1999
  master_port_range_low: 1400
  num_nodes: 32
  segment_size: null
data:
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  max_input_seq_length: null
  num_workers: 1
  shuffle: true
  train:
    data_path: ${art:data,train}
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  use_multiple_dataloader: false
  validation:
    data_path: ${art:data,val}
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
data_plane: null
env:
  nemo_gym:
    config_paths:
    - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
    - resources_servers/math_with_judge/configs/math_with_judge.yaml
    - resources_servers/mcqa/configs/mcqa.yaml
    - resources_servers/gui_coordinate/configs/gui_coordinate.yaml
    - resources_servers/string_match/configs/string_match.yaml
    math_with_judge:
      resources_servers:
        math_with_judge:
          judge_model_server:
            name: policy_model
          should_use_judge: false
    nemo_gym_log_dir: ${logger.log_dir}/nemo_gym
    pad_dynamic_image_shapes: true
    policy_max_input_tokens: 32768
    policy_model:
      responses_api_models:
        vllm_model:
          extra_body:
            bad_words:
            - <image>
            - <img>
            - </img>
            - <so_embedding>
            - <so_start>
            - <so_end>
            chat_template_kwargs:
              enable_thinking: true
          uses_reasoning_parser: true
    port_range_high: 5999
    port_range_low: 5000
    skip_venv_if_present: true
    string_match:
      resources_servers:
        string_match:
          # TODO(open-source): structured-answer verifier (set / ordered-list / interval grading)
          # is a custom string_match entrypoint; it must be added to public Gym under this name.
          entrypoint: structured_answer_app.py
    tokenizer_config:
      chat_template: ${policy.model_name}/chat_template.jinja
      name: ${policy.model_name}
    uv_venv_dir: ${oc.env:NEMO_GYM_VENV_DIR,/opt/gym_venvs}
    num_gpu_nodes: 0
  should_log_nemo_gym_responses: true
  should_mask_flagged_samples: true
  should_use_nemo_gym: true
grpo:
  adv_estimator:
    minus_baseline: true
    name: grpo
    normalize_rewards: true
    reward_weights: null
    use_leave_one_out_baseline: true
  advantage_clip_high: 20.0
  advantage_clip_low: -20.0
  async_grpo:
    enabled: true
    in_flight_weight_updates: true
    max_generation_failures: 0
    max_trajectory_age_steps: 1
    recompute_kv_cache_after_weight_updates: false
  batch_multiplier: 1.0
  calculate_advantages_on_gpu: false
  debug_payload_metrics: false
  deduplicate_multimodal_data: true
  dynamic_sampling_max_gen_batches: 10
  invalid_tool_call_advantage: -5.0
  malformed_thinking_advantage: null
  max_num_epochs: 1
  max_num_steps: 54
  max_rollout_turns: 1
  max_val_samples: null
  normalize_rewards: true
  num_generations_per_prompt: 16
  num_prompts_per_step: 256
  overlong_filtering: false
  penalize_invalid_tool_call: true
  reward_scaling:
    enabled: false
    source_max: 1.0
    source_min: 0.0
    target_max: 1.0
    target_min: 0.0
  reward_shaping:
    enabled: false
    max_response_length: null
    overlong_buffer_length: null
    overlong_buffer_penalty: null
    stop_properly_penalty_coef: null
  seed: 42
  seq_logprob_error_threshold: 2.0
  skip_reference_policy_logprobs_calculation: true
  stop_at_validation_metric: null
  stop_at_validation_threshold: null
  use_dynamic_sampling: false
  use_leave_one_out_baseline: true
  val_at_end: false
  val_at_start: false
  val_batch_size: null
  val_num_generations_per_prompt: 4
  val_period: 0
  val_start_at: -1
  zero_variance_prompt_filtering: false
logger:
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10
  log_dir: results/super35-rl-teacher-vision-reasoning/logs
  mlflow:
    experiment_name: super35-rl-teacher-vision-reasoning
    run_name: super35-rl-teacher-vision-reasoning
  mlflow_enabled: false
  monitor_gpus: true
  num_val_samples_to_print: 0
  swanlab_enabled: false
  tensorboard: {}
  tensorboard_enabled: false
  wandb:
    log_nemo_gym_full_result_tables: false
    name: super35-rl-teacher-vision-reasoning
    project: super35-rl-teacher-vision-reasoning
  wandb_enabled: true
loss_fn:
  disable_ppo_ratio: false
  force_on_policy_ratio: false
  kl_input_clamp_value: null
  kl_output_clamp_value: null
  positive_example_nll_weight: 0.0
  ratio_clip_c: null
  ratio_clip_max: 0.28
  ratio_clip_min: 0.2
  reference_policy_kl_penalty: 0.0
  reference_policy_kl_type: k3
  sequence_level_importance_ratios: false
  token_level_loss: false
  truncated_importance_sampling_ratio: 5.0
  truncated_importance_sampling_ratio_min: 0.2
  truncated_importance_sampling_type: tis
  use_cispo: false
  use_importance_sampling_correction: true
  use_kl_in_reward: false
  use_on_policy_kl_approximation: true
on_policy_distillation: null
policy:
  draft:
    aux_layer_indices: null
    enabled: false
    loss_weight: 0.1
    model_name: null
    num_layers: null
  dtensor_cfg:
    _v2: true
    activation_checkpointing: false
    context_parallel_size: 1
    cpu_offload: false
    custom_parallel_plan: null
    enabled: false
    sequence_parallel: false
    tensor_parallel_size: 1
  dynamic_batching:
    enabled: false
    logprob_mb_tokens: 32768
    sequence_length_round: 64
    train_mb_tokens: 32768
  generation:
    backend: vllm
    bad_words:
    - <image>
    - <img>
    - </img>
    - <so_embedding>
    - <so_start>
    - <so_end>
    colocated:
      enabled: false
      resources:
        gpus_per_node: 4
        num_nodes: 16
    max_new_tokens: 32768
    model_name: ${policy.model_name}
    port_range_high: 4999
    port_range_low: 3000
    stop_strings: null
    stop_token_ids: null
    temperature: 1.0
    top_k: null
    top_p: 1.0
    val_temperature: 1.0
    val_top_k: null
    val_top_p: 1.0
    vllm_cfg:
      async_engine: true
      enable_prefix_caching: false
      enforce_eager: false
      env_vars:
        NRL_VLLM_FP32_LM_HEAD: '1'
      expert_parallel_size: 4
      expose_http_server: true
      gpu_memory_utilization: 0.8
      http_server_serving_chat_kwargs:
        chat_template: ${policy.model_name}/chat_template.jinja
        chat_template_content_format: openai
        enable_auto_tools: true
        reasoning_parser: nano_v3
        tool_parser: qwen3_coder
      kv_cache_dtype: auto
      load_format: auto
      logprobs_mode: raw_logprobs
      max_model_len: 32768
      num_first_layers_in_bf16: 0
      num_last_layers_in_bf16: 0
      pipeline_parallel_size: 1
      precision: bfloat16
      reasoning_parser_plugin: nemo_rl/models/generation/vllm/reasoning_parsers/nano_v3_reasoning_parser.py
      skip_tokenizer_init: false
      tensor_parallel_size: 4
      use_deep_gemm: false
    vllm_kwargs:
      compilation_config:
        backend: eager
        cudagraph_capture_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        - 256
        pass_config:
          fuse_allreduce_rms: false
      disable_custom_all_reduce: true
      enable_chunked_prefill: true
      enable_return_routed_experts: true
      hf_overrides: {}
      limit_mm_per_prompt:
        image: 20
      mamba_ssm_cache_dtype: float32
      max_num_batched_tokens: 32768
      max_num_seqs: 256
      mm_processor_cache_gb: 0
      moe_backend: flashinfer_trtllm
      skip_mm_profiling: true
  generation_batch_size: 64
  is_vlm: true
  logprob_batch_size: 1
  logprob_chunk_size: 256
  make_sequence_length_divisible_by: 8
  max_grad_norm: 1.0
  max_total_sequence_length: 32768
  megatron_cfg:
    activation_checkpointing: true
    apply_rope_fusion: true
    bias_activation_fusion: false
    calculate_per_token_loss: true
    checkpoint:
      async_save: false
    context_parallel_size: 2
    cp_normalize: true
    defer_fp32_logits: true
    distributed_data_parallel_config:
      average_in_collective: false
      data_parallel_sharding_strategy: optim_grads_params
      grad_reduce_in_fp32: false
      overlap_grad_reduce: false
      overlap_param_gather: true
      use_custom_fsdp: false
    do_not_average_loss: true
    empty_unused_memory_level: 2
    enabled: true
    env_vars: null
    expert_model_parallel_size: 16
    expert_tensor_parallel_size: 1
    fp32_lm_head: tf32
    fp8_cfg:
      enabled: false
    freeze_moe_router: true
    freeze_sound_encoder: true
    freeze_sound_projection: true
    freeze_vision_model: true
    freeze_vision_projection: true
    gradient_accumulation_fusion: false
    moe_aux_loss_coeff: 0.0
    moe_enable_deepep: false
    moe_per_layer_logging: true
    moe_permute_fusion: true
    moe_router_bias_update_rate: 0.001
    moe_router_dtype: fp32
    moe_router_enable_expert_bias: true
    moe_router_load_balancing_type: none
    moe_shared_expert_overlap: false
    moe_token_dispatcher_type: alltoall
    mtp_detach_heads: true
    mtp_loss_scaling_factor: 0.3
    mtp_num_layers: 5
    mtp_use_repeated_layer: true
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null
    optimizer:
      adam_beta1: 0.9
      adam_beta2: 0.99
      adam_eps: 1.0e-08
      bf16: true
      clip_grad: 1.0
      fp16: false
      lr: 3.0e-06
      min_lr: 2.0e-09
      optimizer: adam
      optimizer_cpu_offload: false
      optimizer_offload_fraction: 0.0
      overlap_cpu_optimizer_d2h_h2d: false
      params_dtype: float32
      sgd_momentum: 0.9
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      weight_decay: 0.0
    pipeline_dtype: bfloat16
    pipeline_model_parallel_size: 1
    radio_force_cpe_eval_mode: true
    scale_loss_by_dp_cp_size: false
    scheduler:
      end_weight_decay: 0.0
      lr_decay_iters: null
      lr_decay_style: constant
      lr_warmup_init: 3.0e-08
      lr_warmup_iters: 10
      override_opt_param_scheduler: true
      start_weight_decay: 0.0
      weight_decay_incr_style: constant
    sequence_parallel: true
    tensor_model_parallel_size: 2
    track_moe_metrics: true
    train_iters: 54
    use_fused_weighted_squared_relu: true
    use_gloo_process_groups: false
  model_name: ${art:base_model,path}
  offload_optimizer_for_logprob: false
  optimizer: null
  precision: bfloat16
  pretrained_checkpoint:
    format: megatron_bridge
    # The shared runner maps the stage-1 step_N artifact to step_N/policy/weights
    # (the native dir holding iter_*/) before NeMo-RL loads it.
    path: ${art:model,path}
  router_replay:
    enabled: true
    transport: ray
  scheduler: null
  sequence_packing:
    algorithm: modified_first_fit_decreasing
    enabled: true
    fuse_loss: true
    logprob_mb_tokens: 32768
    microbatch_order: largest_first
    sequence_length_round: 64
    train_mb_tokens: 32768
  tokenizer:
    chat_template: ${policy.model_name}/chat_template.jinja
    name: ${policy.model_name}
  train_global_batch_size: 4096
  train_micro_batch_size: 1
reward_penalties:
  penalize_duplicated_reasoning: false
  penalize_empty_final_answer: false
  penalize_malformed_think_tag: false
  penalize_unwanted_tokens: false
  token_ids: null
