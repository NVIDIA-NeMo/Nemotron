# =============================================================================
# Nemotron 3.5 Super VL — MOPD phase 1 (multi-teacher on-policy distillation)
# =============================================================================
# Student:   RLVR step 120 (run.model). The `general` self-anchor teacher is a
#            frozen copy of the same checkpoint.
# Teachers:  Agentic (35% of prompts), Reasoning (25%), RLHF teacher 1 (20%),
#            Vision tool-use (15%); 5% of prompts go to the self-anchor
#            (tech report §3.6). Proximal-teacher alpha 1 (plain teacher).
# Batch:     512 prompts x 1 rollout, 48K generation in a 128K context, LR 2e-6.
# Selected:  step 30 (max_num_steps is the original 200-step budget).
#
# Cluster (128 nodes x 4 GPUs):
#   Training 64 (TP4 / CP4 / EP16) + vLLM generation 30 + teachers 34
#   (Agentic 16, Reasoning 8, RLHF 4, Vision 4, general 2; each TP8 / EP8).
#
# Reference-run note: the selected step-30 checkpoint's saved config trained with
# TP8 / CP8 / EP16 and zero MTP loss; this maintained recipe uses TP4 / CP4 /
# EP16 and the common detached MTP5 training (coefficient 0.3). Policy MTP
# inference is off.
#
# CLI: nemotron super35 rl mopd --run <profile>
#
# Canonical teacher aliases MUST precede task aliases: NeMo RL deduplicates by
# checkpoint and uses the first alias's fleet settings. Task aliases interpolate
# those canonical entries, so changing a teacher updates all its routes.
# Agent names missing from `teacher_model_by_agent_name` fall back to
# `default_teacher_alias` (`general`, the self-anchor).
#
# Verification is skipped (`skip_verification: true`): rewards are not used,
# the advantage is the teacher/student log-prob gap, so no judge or GenRM
# servers are needed. Resource-server data paths below (competitive coding,
# finance SEC cache, SciCode) may still be opened when those servers start; see README.md.
# Replay restoration is disabled (`load_replay_buffer: false`).
#
# Requires NeMo-RL super-v3.5-posttraining @ f299847f1 (Gym e24db4e6); see ../../Dockerfile.
# =============================================================================

run:
  model: super35-rl-rlvr-model:latest  # student and `general` self-anchor teacher
  data: super35-rl-mopd-phase1-data:latest
  output_artifact: super35-rl-mopd-phase1-model
  hf_architecture: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
  # Teacher checkpoints (canonical aliases in on_policy_distillation).
  teacher_agentic: super35-rl-teacher-agentic-model:latest  # Agentic
  teacher_reasoning: super35-rl-teacher-reasoning-model:latest  # Reasoning
  teacher_rlhf: super35-rl-teacher-rlhf1-model:latest  # RLHF (teacher 1, step 500)
  teacher_vision: super35-rl-teacher-vision-model:latest  # Vision
  env:
    container: /home/${oc.env:USER}/.cache/nemotron/containers/super35-rl.sqsh
    nodes: 128  # = cluster.num_nodes (training + generation + teacher fleets)
    sandbox:
      container: ""  # Set to a NeMo-Skills sandbox image (code-execution environments)
      port: 6000
      # The reference run retried the sandbox start up to six times.
      command: 'for _a in 1 2 3 4 5 6; do /start-with-nginx.sh; echo "[RETRY] sandbox start attempt $_a failed; cleaning up and retrying"; pkill -9 -f "[u]vicorn" 2>/dev/null; pkill -9 -x nginx 2>/dev/null; sleep 20; done'
    persistent_cache: ""  # Set to a shared cache dir for vLLM/FlashInfer compile caches
    env_vars:
      NRL_VLLM_USE_V1: "1"
      NRL_IGNORE_VERSION_MISMATCH: "1"
      NRL_BEST_EFFORT_EMPTY_CACHE: "1"
      NEMO_GYM_VENV_DIR: "/opt/gym_venvs"
      # Root that relative image/video paths in the MOPD data resolve against.
      NEMO_RL_VIDEO_MEDIA_ROOT: "/path/to/media_root"
      # Resource-server data read at startup (unused for rewards; see header).
      CCC_TEST_METADATA: "/path/to/ccc_test_metadata.jsonl"
      FINANCE_SEC_CACHE_DIR: "/path/to/sec-cache"
      SCICODE_TEST_DATA: "/path/to/scicode/combined_test_data.h5"

checkpointing:
  checkpoint_dir: results/super35-rl-mopd-phase1/checkpoints
  # Leave a checkpointing margin within a 12-hour walltime.
  checkpoint_must_save_by: 00:11:30:00
  enabled: true
  ft_keep_latest_k: 3
  ft_save_period: 1
  higher_is_better: true
  keep_top_k: 1000
  load_replay_buffer: false
  metric_name: null
  save_optimizer: true
  save_period: 5
cluster:
  gpus_per_node: 4
  master_port_range_high: 1999
  master_port_range_low: 1400
  num_nodes: 128
  # Match the original run: do not constrain whole teacher fleets to one domain.
  segment_size: null
on_policy_distillation:
  deduplicate_shared_teacher_checkpoints: true
  default_teacher_alias: general
  enabled: true
  log_sample_responses: false
  log_sample_stats: false
  log_token_stats: false
  log_topk_stats: false
  non_colocated_teachers:
    default_teacher_cfg:
      context_parallel_size: 1
      empty_unused_memory_level: 1
      expert_model_parallel_size: 8
      gpus_per_node: 4
      micro_batch_size: 1
      moe_shared_expert_overlap: false
      num_nodes: 4
      pipeline_model_parallel_size: 1
      precision: bf16
      tensor_model_parallel_size: 8
    enabled: true
    teacher_overrides:
      Agentic:
        num_nodes: 16
      RLHF:
        num_nodes: 4
        radio_force_cpe_eval_mode: true
      Reasoning:
        num_nodes: 8
        radio_force_cpe_eval_mode: true
      Vision:
        num_nodes: 4
        radio_force_cpe_eval_mode: true
      general:
        num_nodes: 2
        radio_force_cpe_eval_mode: true
  sample_response_max_tokens: null
  sample_stats_log_period: 1
  strict_agent_name_match: false
  teacher_model_by_agent_name:
    # Canonical teacher aliases (MUST come first; fleets are keyed by these).
    Agentic: ${art:teacher_agentic,path}
    RLHF: ${art:teacher_rlhf,path}
    Reasoning: ${art:teacher_reasoning,path}
    Vision: ${art:teacher_vision,path}
    general: ${art:model,path}  # self-anchor: frozen copy of the student start
    # Task aliases: Gym agent name -> canonical teacher.
    abstention_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    calendar_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    citation_format_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    citation_if_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    code_gen_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    competitive_coding_challenges_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    conversational_tool_use_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    droid_pivot_single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    equivalence_llm_judge_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Reasoning}
    finance_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    freeform_formatting_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    genrm_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.RLHF}
    genrm_simple_agent_reasoning_off: ${on_policy_distillation.teacher_model_by_agent_name.RLHF}
    image_tools_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Vision}
    instruction_following_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    inverse_if_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    jailbreak_engagement_with_disclaimer: ${on_policy_distillation.teacher_model_by_agent_name.general}
    jailbreak_hard_refusal_no_redirection: ${on_policy_distillation.teacher_model_by_agent_name.general}
    jailbreak_hard_refusal_with_helplines: ${on_policy_distillation.teacher_model_by_agent_name.general}
    jailbreak_refusal_with_explanation: ${on_policy_distillation.teacher_model_by_agent_name.general}
    lc_equivalence_rule_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    lc_judge_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    math_formal_lean_refinement_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    math_with_judge_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Reasoning}
    multichallenge_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    ns_tools_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    nvarc_inductive_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    nvarc_transductive_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    reasoning_gym_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    scicode_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    search_pivot_single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Reasoning}
    single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    structured_outputs_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    structured_outputs_v3_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    structured_outputs_v4_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
    swe_pivot_single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    terminal_multi_harness_opencode_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    terminus_judge_string_only_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    toolcall_schema_single_step_tool_use_with_argument_comparison_agent: ${on_policy_distillation.teacher_model_by_agent_name.Agentic}
    workplace_assistant_simple_agent: ${on_policy_distillation.teacher_model_by_agent_name.general}
  token_stats_log_period: 1
  topk_stats_k: 32
  topk_stats_log_period: 1
  topk_stats_max_tokens: null
  topk_stats_mode: student_online_teacher_deferred
data:
  default:
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  max_input_seq_length: 131072
  num_workers: 1
  shuffle: false
  train:
    data_path: ${art:data,train}
    dataset_name: NemoGymDataset
    env_name: nemo_gym
    processor: nemo_gym_data_processor
    prompt_file: null
    system_prompt_file: null
  use_multiple_dataloader: false
  validation:
    data_path: ${art:data,val}
data_plane: null
