      responses_api_agents:
        simple_agent:
          max_steps: 1
    finance_sec_search_resources_server:
      resources_servers:
        finance_sec_search:
          cache_dir: ${oc.env:FINANCE_SEC_CACHE_DIR,/path/to/sec-cache}/finance_sec_search
          judge_model_server: null
          max_connections_per_host: 1
          max_rollout_time_seconds: 1800
          requests_per_second: 1
          retrieval_max_output_tokens: 8192
          retrieval_model_context_length: 131072
          retrieval_responses_create_params:
            input: []
            temperature: 1
            top_p: 1
          reward_mode: scaled
          sec_dump_path: ${oc.env:FINANCE_SEC_CACHE_DIR,/path/to/sec-cache}/data
          use_cache: true
    freeform_formatting_simple_agent:
      responses_api_agents:
        simple_agent:
          max_steps: 1
    genrm_compare_resources_server:
      resources_servers:
        genrm_compare:
          aggregator_method: simple_tiebreaker
          answer_bonus: 0.5
          comparison_strategy: circular
          default_principle: Please act as an impartial judge and evaluate the quality of the responses provided
            by two AI assistants to the user prompt. Begin your evaluation by generating your own answer to the
            prompt. You must provide your answer before judging any answers. When evaluating the assistants' answers,
            compare both assistants' answers with your answer. You must identify and correct any mistakes or inaccurate
            information. Then consider if the assistant's answers are helpful, relevant, and concise. Helpful means
            the answer correctly responds to the prompt or follows the instructions. Note when user prompt has any
            ambiguity or more than one interpretation, it is more helpful and appropriate to ask for clarifications
            or more information from the user than providing an answer based on assumptions. Relevant means all
            parts of the response closely connect or are appropriate to what is being asked. Concise means the response
            is clear and not verbose or excessive. Then consider the creativity and novelty of the assistant's answers
            when needed. Finally, identify any missing important information in the assistants' answers that would
            be beneficial to include when responding to the user prompt.
          default_ranking: 3.5
          default_score: 3
          genrm_model_server:
            name: policy_model
            type: responses_api_models
          genrm_responses_create_params:
            max_output_tokens: 16384
            temperature: 0.6
            top_p: 0.95
          group_answer_length_penalty_coeff: 0.35
          group_reasoning_length_penalty_coeff: 0.3
          group_style_penalty_coeff: 0.05
          num_judges_per_comparison: 1
          num_rollouts_per_prompt: 1
          reasoning_bonus: 0.5
          top_percentile: 0.2
          use_principle: true
