# Super35 stage 1 — SFT stage 1 (default)
#
# Megatron-Bridge's `nemotron_35_super_vl_sft_config` (64x H100, BF16):
# vision encoder frozen, vision projector + language model trainable, two
# shared MTP prediction depths at loss scale 0.3, Energon image/video-text
# data through the Omni task encoder (no audio), `nemotron_omni_step`.
#
# Defaults are Megatron-Bridge's verified H100 SFT card (2026-09-25) so the
# config runs as-is: 8 nodes x 8 H100, TP2 + sequence parallel, PP2, EP32,
# full uniform recompute, sequence length 4096, GBS/MBS 1280/1, 200 steps.
#
# Production SFT (tech report §3.1) — for reference; these need the full
# (non-public) SFT blend and long-sequence packing to reproduce:
#   - packed sequences of up to 524,288 tokens, global batch size 32
#   - LR warmup over 100 packed samples (~9,100 records) to 1e-5, then constant
#     (optimizer.lr: 1.0e-5, scheduler.lr_warmup_iters: 100,
#      scheduler.lr_decay_style: constant)
#   - Adam beta1 0.9 / beta2 0.95, weight decay 0.1, gradient clipping 1.0
#     (optimizer.adam_beta1 / adam_beta2 / weight_decay / clip_grad)
#   - two shared-weight MTP layers, auxiliary loss scale 0.3 (recipe default)
#   - language and vision components fine-tuned jointly (the MB recipe freezes
#     the vision encoder; set model.freeze_vision_model=false to match)
#   - preceded by a vision-projector warm-up, followed by a small second SFT
#     stage with a re-balanced blend (config/stage2.yaml)
#
# Inputs:
#   run.model  Megatron-format starting checkpoint. `super35-pretrain-model` is
#              stage 0's output, or a converted Hugging Face checkpoint
#              registered with `nemotron super35 model import pretrain`.
#   run.data   Energon WebDataset registered with `nemotron super35 data import sft`.
#              The Super 3.5 SFT blend is not public yet; bring your own.

run:
  model: super35-pretrain-model:latest
  data: super35-sft-data:latest
  env:
    # Public NeMo 26.08 container (same as lightning35).
    container: nvcr.io/nvidia/nemo:26.08
    env_vars:
      # Triton/Inductor/FlashInfer JIT caches default under /root, whose
      # container overlay is tiny — use node-local /tmp instead.
      TRITON_CACHE_DIR: /tmp/triton_cache
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor_cache
      TORCH_EXTENSIONS_DIR: /tmp/torch_extensions
      XDG_CACHE_HOME: /tmp/xdg_cache
    # The Super-VL recipes (megatron.bridge.recipes.nemotronh_multimodal)
    # exist only on recent Megatron-Bridge main. Mount the pinned MB commit
    # over the container's copy, plus the Megatron-LM revision that commit
    # pins as its 3rdparty/Megatron-LM submodule.
    mounts:
      - ${auto_mount:git+https://github.com/NVIDIA-NeMo/Megatron-Bridge.git@f7f37b263307812702ee57bbc413a8a26c0924b5,/opt/Megatron-Bridge}
      - ${auto_mount:git+https://github.com/NVIDIA/Megatron-LM.git@bab851bfe3abc805256155962389ec0fe5de7571,/opt/Megatron-Bridge/3rdparty/Megatron-LM}

recipe:
  _target_: megatron.bridge.recipes.nemotronh_multimodal.nemotron_35_super_vl_sft_config
  step_func: nemotron_omni_step

dataset:
  path: ${art:data,path}
  seq_length: 4096
  num_workers: 2
  do_validation: false

model:
  seq_length: 4096
  # Verified-card overrides on top of the recipe's TP1/PP2/EP32 layout.
  tensor_model_parallel_size: 2
  sequence_parallel: true
  recompute_granularity: full
  recompute_method: uniform
  recompute_num_layers: 1
  recompute_modules: []
  # Freeze policy (recipe default, MB SFT): train LM + projector, freeze RADIO.
  freeze_language_model: false
  freeze_vision_model: true
  freeze_vision_projection: false

train:
  train_iters: 200
  global_batch_size: 1280
  micro_batch_size: 1

scheduler:
  lr_decay_iters: 200

validation:
  eval_iters: 0
  eval_interval: 0

logger:
  log_interval: 1
  log_throughput: true
  wandb_project: ${run.wandb.project}   # Set from env.toml [wandb]
  wandb_entity: ${run.wandb.entity}     # Set from env.toml [wandb]
  wandb_exp_name: super35-sft-stage1

checkpoint:
  save: /nemo_run/super35-sft-stage1-model
  save_interval: 100
  pretrained_checkpoint: ${art:model,path}
  load: null
  load_optim: false
  load_rng: false
  async_save: false
