# Generate a Slurm env.slurm.toml that demonstrates step-linked profiles.
#
# This mirrors the Lepton example: one backend base plus concrete profiles
# named for individual steps. Replace host/account/paths with site values.
# Step configs remain the source of truth for image/recipe-specific requirements;
# these profiles provide generic fallbacks plus cluster logistics.

output_path: env.slurm.toml
force: false

preamble: |
  # Generated by `nemotron steps run env/env_toml -c slurm`.
  # Keep secrets out of this file; pass tokens through ${oc.env:...} placeholders.
  #
  # Example usage after review:
  #   export NEMOTRON_ENV_FILE=env.slurm.toml
  #   uv run nemotron steps run data_prep/sft_packing -c tiny --batch slurm_prep_sft_packing
  #   uv run nemotron steps run data_prep/pretrain_prep -c tiny --batch slurm_prep_pretrain_prep
  #   uv run nemotron steps run data_prep/rl_prep -c tiny --batch slurm_prep_rl_prep
  #   uv run nemotron steps run pretrain/megatron_bridge -c tiny --batch slurm_pretrain_megatron_bridge
  #   uv run nemotron steps run pretrain/automodel -c tiny --batch slurm_pretrain_automodel
  #   uv run nemotron steps run sft/megatron_bridge -c tiny --batch slurm_sft_megatron_bridge
  #   uv run nemotron steps run sft/automodel -c tiny --batch slurm_sft_automodel
  #   uv run nemotron steps run peft/megatron_bridge -c tiny --batch slurm_peft_megatron_bridge
  #   uv run nemotron steps run peft/automodel -c tiny --batch slurm_peft_automodel
  #   uv run nemotron steps run convert/hf_to_megatron -c default --batch slurm_convert_model
  #   uv run nemotron steps run convert/megatron_to_hf -c default --batch slurm_convert_model
  #   uv run nemotron steps run convert/merge_lora -c default --batch slurm_convert_model
  #   uv run nemotron steps run rl/nemo_rl/dpo -c tiny --batch slurm_rl_nemo_rl_dpo
  #   uv run nemotron steps run rl/nemo_rl/rlvr -c tiny --batch slurm_rl_nemo_rl_rlvr
  #   uv run nemotron steps run rl/nemo_rl/rlhf -c tiny --batch slurm_rl_nemo_rl_rlhf
  #   uv run nemotron steps run optimize/modelopt/quantize -c tiny --batch slurm_optimize_modelopt_quantize
  #   uv run nemotron steps run optimize/modelopt/distill -c tiny --batch slurm_optimize_modelopt_distill
  #   uv run nemotron steps run optimize/modelopt/prune -c tiny --batch slurm_optimize_modelopt_prune
  #   uv run nemotron steps run eval/model_eval -c tiny_chat --batch slurm_eval_model_eval
  #   uv run nemotron steps run eval/model_eval -c direct --batch slurm_eval_direct
  #   uv run nemotron steps run byob/mcq -c tiny --batch slurm_byob_cpu stage=all
  #   uv run nemotron steps run byob/mcq -c tiny --batch slurm_byob_full stage=all
  #   uv run nemotron steps run sdg/data_designer -c tiny --batch slurm_sdg_data_designer_tiny
  #   uv run nemotron steps run sdg/persona_mcq -c tiny --batch slurm_sdg_persona_mcq_tiny
  #   uv run nemotron steps run sdg/persona_mcq -c default --batch slurm_sdg_persona_mcq
  #   uv run nemotron steps run translate/nemo_curator -c default --batch slurm_translate
  #   uv run nemotron steps run curate/nemo_curator -c tiny --batch slurm_curate

checks:
  required_profiles:
    - slurm_base
    - slurm_curator_base
    - slurm_prep_base
    - slurm_prep_sft_packing
    - slurm_prep_pretrain_prep
    - slurm_prep_rl_prep
    - slurm_pretrain_megatron_bridge
    - slurm_pretrain_automodel
    - slurm_sft_megatron_bridge
    - slurm_sft_automodel
    - slurm_peft_megatron_bridge
    - slurm_peft_automodel
    - slurm_convert_model
    - slurm_tokenizer_extend
    - slurm_tokenizer_init_embeddings
    - slurm_tokenizer_evaluate
    - slurm_tokenizer_eval_init
    - slurm_rl_nemo_rl_dpo
    - slurm_rl_nemo_rl_rlvr
    - slurm_rl_nemo_rl_rlhf
    - slurm_optimize_modelopt_quantize
    - slurm_optimize_modelopt_distill
    - slurm_optimize_modelopt_prune
    - slurm_eval_model_eval
    - slurm_eval_direct
    - slurm_byob_cpu
    - slurm_byob_full
    - slurm_sdg_data_designer
    - slurm_sdg_data_designer_tiny
    - slurm_sdg_data_designer_default
    - slurm_sdg_data_designer_customer_support_tools
    - slurm_sdg_data_designer_rl_pref
    - slurm_sdg_persona_mcq
    - slurm_sdg_persona_mcq_tiny
    - slurm_translate
    - slurm_curate

sections:
  wandb:
    project: ${oc.env:WANDB_PROJECT,nemotron}
    entity: ${oc.env:WANDB_ENTITY,nvidia}

  slurm_base:
    executor: slurm
    tunnel: ssh
    host: ${oc.env:SLURM_HOST,login.example.com}
    user: ${oc.env:USER}
    account: ${oc.env:SLURM_ACCOUNT,nemotron}
    partition: ${oc.env:SLURM_PARTITION,batch}
    container_image: nvcr.io/nvidia/nemo:25.11.nemotron_3_nano
    # Single shared-storage root. remote_job_dir, outputs, and HF_HOME below all
    # derive from NEMOTRON_WORKSPACE so overriding that one env var relocates
    # them together. (The PYTHONPATH paths are container-internal, not on the
    # workspace, so they stay fixed.) Each derived path anchors on the env var
    # directly since sibling ${workspace} refs can't survive env.toml round-trip.
    # workspace: persistent shared-storage root (per-user Lustre) that every job mounts; parent of paths below.
    workspace: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}
    # remote_job_dir: NeMo-Run staging + per-job run outputs (packaged code, logs, checkpoints) on Lustre.
    remote_job_dir: ${oc.env:NEMO_RUN_DIR,${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/nemo-run}
    mounts:
      # host_path:container_path bind mounts; Lustre is exposed at the same path inside the container.
      - /lustre:/lustre
    lustre_mount: ""
    nodes: 1
    ntasks_per_node: 8
    gpus_per_node: 8
    time: "02:00:00"
    env_vars:
      HF_TOKEN: ${oc.env:HF_TOKEN,''}
      # HF_HOME: HuggingFace cache (models/datasets/tokenizers); on Lustre so it is reused across jobs.
      HF_HOME: ${oc.env:HF_HOME,${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/hf}
      WANDB_API_KEY: ${oc.env:WANDB_API_KEY,''}
      WANDB_PROJECT: ${oc.env:WANDB_PROJECT,nemotron}
      # PYTHONPATH: container-internal staged source (where NeMo-Run unpacks code), not on the workspace.
      PYTHONPATH: /nemo_run/code/src
      RAY_DEDUP_LOGS: "0"

  # data_prep/*: prep jobs are CPU-only. Override the GPU base so Slurm
  # does not submit to GPU partitions or request GPUs for the image import/job.
  slurm_prep_base:
    extends: slurm_base
    partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_include_gpus: false
    build_gpus_per_node: 0
    ntasks_per_node: 1
    cpus_per_task: 4
    gpus_per_node: 0
    time: "01:00:00"
    startup_commands:
      - uv pip install --python /opt/venv/bin/python --quiet cosmos-xenna protobuf
    env_vars:
      # RAY_RUNTIME_ENV_PYTHONPATH: dir Ray prepends to each worker's PYTHONPATH (container-internal
      # staged source). Set once here; child prep profiles inherit it via `extends`.
      RAY_RUNTIME_ENV_PYTHONPATH: /nemo_run/code/src
      # RAY_MAX_LIMIT_FROM_API_SERVER: raises Ray's API-server response cap for large prep job graphs.
      RAY_MAX_LIMIT_FROM_API_SERVER: "100000"

  slurm_prep_sft_packing:
    extends: slurm_prep_base
    env_vars:
      # *_OUTPUT_DIR: per-step destination for that step's artifacts, under <workspace>/output.
      # Override the specific env var (e.g. SFT_OUTPUT_DIR) to redirect just this step.
      SFT_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/data_prep/sft_packing

  slurm_prep_pretrain_prep:
    extends: slurm_prep_base
    env_vars:
      PRETRAIN_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/data_prep/pretrain_prep

  slurm_prep_rl_prep:
    extends: slurm_prep_base
    env_vars:
      RL_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/data_prep/rl_prep

  # Curator-backed steps: byob/mcq, translate/nemo_curator, and curate all use the Curator
  # container and install their Python runtime through the generic curator_runtime
  # bootstrap, using requirements generated from pyproject/uv.lock at submission time.
  slurm_curator_base:
    extends: slurm_base
    container_image: nvcr.io/nvidia/nemo-curator:26.02
    partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_include_gpus: false
    build_gpus_per_node: 0
    ntasks_per_node: 1
    cpus_per_task: 4
    gpus_per_node: 0
    time: "01:00:00"

  # byob CPU smoke: keeps semantic dedup, coverage, and semantic outlier stages
  # disabled. Those optional stages need the GPU/RAPIDS profile below.
  slurm_byob_cpu:
    extends: slurm_curator_base
    run_command: python -m nemotron.steps._bootstrap.curator_runtime --profile byob -- python -m nemotron.steps.byob.mcq.step --config {config}
    env_vars:
      NVIDIA_API_KEY: ${oc.env:NVIDIA_API_KEY,''}
      NGC_API_KEY: ${oc.env:NGC_API_KEY,''}

  # byob full: adds the heavy GPU stack required by Curator semantic dedup and
  # related embedding/semantic quality stages.
  slurm_byob_full:
    extends: slurm_byob_cpu
    partition: ${oc.env:SLURM_GPU_PARTITION,${oc.env:SLURM_PARTITION,batch}}
    build_partition: ${oc.env:SLURM_GPU_PARTITION,${oc.env:SLURM_PARTITION,batch}}
    build_include_gpus: true
    build_gpus_per_node: 1
    ntasks_per_node: 1
    cpus_per_task: 8
    gpus_per_node: 1
    time: "02:00:00"
    run_command: python -m nemotron.steps._bootstrap.curator_runtime --profile byob-gpu -- python -m nemotron.steps.byob.mcq.step --config {config}

  # sdg/data_designer: CPU-only synthetic generation through remote model
  # endpoints. Config variants choose SFT vs tool-call vs RL preference output.
  slurm_sdg_data_designer:
    extends: slurm_base
    container_image: nvcr.io/nvidia/nemo:25.11.nemotron_3_nano
    partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_include_gpus: false
    build_gpus_per_node: 0
    ntasks_per_node: 1
    cpus_per_task: 4
    gpus_per_node: 0
    time: "01:00:00"
    startup_commands:
      - python -m pip install --quiet --break-system-packages data-designer==0.5.5
    env_vars:
      SDG_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/sdg
      NVIDIA_API_KEY: ${oc.env:NVIDIA_API_KEY,''}

  slurm_sdg_data_designer_tiny:
    extends: slurm_sdg_data_designer
    env_vars:
      SDG_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/sdg/sft/tiny

  slurm_sdg_data_designer_default:
    extends: slurm_sdg_data_designer
    env_vars:
      SDG_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/sdg/sft/default

  slurm_sdg_data_designer_customer_support_tools:
    extends: slurm_sdg_data_designer
    env_vars:
      SDG_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/sdg/sft/customer_support_tools

  slurm_sdg_data_designer_rl_pref:
    extends: slurm_sdg_data_designer
    env_vars:
      SDG_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/sdg/rl/rl_pref

  # sdg/persona_mcq: remote endpoints author and answer questions; the GPU is
  # reserved for multilingual semantic deduplication. Shared paths make runs resumable.
  slurm_sdg_persona_mcq:
    extends: slurm_sdg_data_designer
    partition: ${oc.env:SLURM_GPU_PARTITION,${oc.env:SLURM_PARTITION,batch}}
    build_partition: ${oc.env:SLURM_GPU_PARTITION,${oc.env:SLURM_PARTITION,batch}}
    build_include_gpus: true
    build_gpus_per_node: 1
    ntasks_per_node: 1
    cpus_per_task: 8
    gpus_per_node: 1
    time: "04:00:00"
    startup_commands:
      - "uv pip install --python /opt/venv/bin/python --quiet 'data-designer>=0.5.9,<0.6' 'sentence-transformers>=5.0.0,<6.0.0' 'torch>=2.10,<2.11'"
      # Shadow a torchvision build tied to the image's original Torch.
      - "uv pip install --python /opt/venv/bin/python --quiet 'torchvision>=0.25,<0.26'"
    env_vars:
      NEMOTRON_RUN_DIR: ${oc.env:NEMOTRON_RUN_DIR,${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/sdg}
      DATA_DESIGNER_HOME: ${oc.env:DATA_DESIGNER_HOME,${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/data-designer}
      DATA_DESIGNER_MANAGED_ASSETS_PATH: ${oc.env:DATA_DESIGNER_MANAGED_ASSETS_PATH,${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/data-designer/managed-assets}
      NVIDIA_API_KEY: ${oc.env:NVIDIA_API_KEY,''}
      NGC_API_KEY: ${oc.env:NGC_API_KEY,''}
      QWEN_API_BASE: ${oc.env:QWEN_API_BASE,''}
      OSS_API_BASE: ${oc.env:OSS_API_BASE,''}
      GEMMA_API_BASE: ${oc.env:GEMMA_API_BASE,''}

  slurm_sdg_persona_mcq_tiny:
    extends: slurm_sdg_persona_mcq
    partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_include_gpus: false
    build_gpus_per_node: 0
    cpus_per_task: 4
    gpus_per_node: 0
    time: "01:00:00"

  # translate/nemo_curator: uses the translate Curator runtime profile.
  slurm_translate:
    extends: slurm_curator_base
    partition: ${oc.env:SLURM_GPU_PARTITION,${oc.env:SLURM_PARTITION,batch}}
    build_partition: ${oc.env:SLURM_GPU_PARTITION,${oc.env:SLURM_PARTITION,batch}}
    build_include_gpus: true
    build_gpus_per_node: 1
    ntasks_per_node: 1
    cpus_per_task: 8
    gpus_per_node: 1
    time: "02:00:00"
    run_command: python -m nemotron.steps._bootstrap.curator_runtime --profile translate -- python -m nemotron.steps.translate.nemo_curator.step --config {config}
    env_vars:
      NVIDIA_API_KEY: ${oc.env:NVIDIA_API_KEY,''}
      NGC_API_KEY: ${oc.env:NGC_API_KEY,''}

  # curate/nemo_curator: runs directly in the Curator container. Keep this
  # simple; translate/byob use curator_runtime because they need extra deps.
  slurm_curate:
    extends: slurm_curator_base
    env_vars:
      NEMOTRON_CURATOR_RAY_NUM_CPUS: "4"

  # pretrain/megatron_bridge: generic NeMo image fallback; tiny configs pin nano3.
  slurm_pretrain_megatron_bridge:
    extends: slurm_base
    container_image: nvcr.io/nvidia/nemo:26.04
    nodes: 2
    ntasks_per_node: 8
    time: "04:00:00"
    env_vars:
      PRETRAIN_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/pretrain/megatron_bridge
      PRETRAIN_BLEND_PATH: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/data_prep/pretrain_prep/blend.json

  # pretrain/automodel: AutoModel pretrain uses the AutoModel image/deps with
  # the same pretrain data-prep output wiring.
  slurm_pretrain_automodel:
    extends: slurm_base
    container_image: nvcr.io/nvidia/nemo-automodel:26.04
    nodes: 2
    ntasks_per_node: 8
    time: "04:00:00"
    startup_commands:
      - python -m pip install --quiet --break-system-packages omegaconf
    env_vars:
      PRETRAIN_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/pretrain/automodel
      PRETRAIN_BLEND_PATH: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/data_prep/pretrain_prep/blend.json
      WANDB_INIT_TIMEOUT: ${oc.env:WANDB_INIT_TIMEOUT,300}
      WANDB_HTTP_TIMEOUT: ${oc.env:WANDB_HTTP_TIMEOUT,300}

  # sft/megatron_bridge: generic NeMo image fallback; config owns recipe target/image.
  slurm_sft_megatron_bridge:
    extends: slurm_base
    container_image: nvcr.io/nvidia/nemo:26.04
    nodes: 2
    ntasks_per_node: 8
    time: "04:00:00"
    env_vars:
      SFT_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/sft/megatron_bridge
      SFT_PACKED_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/data_prep/sft_packing/splits/train/*.parquet

  # sft/automodel: switches to the AutoModel image/deps.
  slurm_sft_automodel:
    extends: slurm_sft_megatron_bridge
    container_image: nvcr.io/nvidia/nemo-automodel:26.04
    startup_commands:
      - python -m pip install --quiet --break-system-packages omegaconf
    env_vars:
      SFT_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/sft/automodel
      WANDB_INIT_TIMEOUT: ${oc.env:WANDB_INIT_TIMEOUT,300}
      WANDB_HTTP_TIMEOUT: ${oc.env:WANDB_HTTP_TIMEOUT,300}

  # peft/*: PEFT uses the same training backends as SFT but writes to PEFT paths.
  slurm_peft_megatron_bridge:
    extends: slurm_sft_megatron_bridge
    env_vars:
      SFT_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/peft/megatron_bridge
      SFT_PACKED_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/data_prep/sft_packing/splits/train/*.parquet

  slurm_peft_automodel:
    extends: slurm_sft_automodel
    env_vars:
      SFT_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/peft/automodel
      WANDB_INIT_TIMEOUT: ${oc.env:WANDB_INIT_TIMEOUT,300}
      WANDB_HTTP_TIMEOUT: ${oc.env:WANDB_HTTP_TIMEOUT,300}

  # convert/*: one shared GPU profile for HF<->Megatron conversion and LoRA merge/export.
  slurm_convert_model:
    extends: slurm_base
    container_image: nvcr.io/nvidia/nemo:26.04
    nodes: 1
    time: "02:00:00"
    env_vars:
      CONVERT_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/convert

  # ---------------------------------------------------------------------------
  # tokenizer_extension/*: build an extended tokenizer, initialise the new
  # embedding rows, and measure the result. Four sub-steps with genuinely
  # different shapes, so one profile each.
  #
  # Optional dependencies (declared as the `tokenizer-extension` extra):
  #   indic-nlp-library  extend, when the target language uses a script
  #                      normalizer (Devanagari family). Missing, the step
  #                      raises rather than silently normalising with NFKC only,
  #                      which would train a different tokenizer.
  #   fasttext-wheel     init_embeddings, method=focus only. The import is lazy,
  #                      so the other init methods run without it.
  # ---------------------------------------------------------------------------

  slurm_tokenizer_extend:
    extends: slurm_base
    partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_include_gpus: false
    build_gpus_per_node: 0
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 16
    gpus_per_node: 0
    time: "04:00:00"
    startup_commands:
      - uv pip install --python /opt/venv/bin/python --quiet indic-nlp-library
    env_vars:
      TOKEXT_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/tokenizer_extension

  slurm_tokenizer_init_embeddings:
    extends: slurm_base
    nodes: 1
    ntasks_per_node: 1
    gpus_per_node: 1
    time: "02:00:00"
    startup_commands:
      - uv pip install --python /opt/venv/bin/python --quiet fasttext-wheel indic-nlp-library
    env_vars:
      TOKEXT_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/tokenizer_extension
      FASTTEXT_CACHE_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/tokenizer_extension/aux

  slurm_tokenizer_evaluate:
    extends: slurm_base
    partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_include_gpus: false
    build_gpus_per_node: 0
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 8
    gpus_per_node: 0
    time: "02:00:00"

  slurm_tokenizer_eval_init:
    extends: slurm_base
    nodes: 1
    ntasks_per_node: 1
    gpus_per_node: 1
    time: "02:00:00"
    # bpb.py loads each model with device_map="auto" when CUDA is visible, which
    # transformers refuses without accelerate.
    startup_commands:
      - uv pip install --python /opt/venv/bin/python --quiet accelerate
  # rl/nemo_rl/dpo: switch image for NeMo-RL while keeping tunnel/account/mounts.
  slurm_rl_nemo_rl_dpo:
    extends: slurm_base
    container_image: nvcr.io/nvidia/nemo-rl:v0.6.0
    nodes: 2
    time: "04:00:00"
    startup_commands:
      - python -m pip install --quiet --break-system-packages omegaconf
    env_vars:
      RL_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/rl/dpo

  # rl/nemo_rl/rlvr: same NeMo-RL image, with RLVR output wiring.
  slurm_rl_nemo_rl_rlvr:
    extends: slurm_rl_nemo_rl_dpo
    env_vars:
      RL_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/rl/rlvr

  # rl/nemo_rl/rlhf: same RL profile, but more physical nodes for GenRM/NeMo-Gym placement.
  slurm_rl_nemo_rl_rlhf:
    extends: slurm_rl_nemo_rl_dpo
    nodes: 4
    env_vars:
      RL_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/rl/rlhf
      RL_PREP_MANIFEST: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/data_prep/rl_prep/manifest.json

  # optimize/modelopt/quantize: switch to the ModelOpt-capable NeMo image.
  slurm_optimize_modelopt_quantize:
    extends: slurm_base
    container_image: nvcr.io/nvidia/nemo:26.04
    nodes: 2
    time: "04:00:00"
    env_vars:
      OPTIM_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/optimize/quantize

  # optimize/modelopt/distill: same ModelOpt-capable image with distillation output wiring.
  slurm_optimize_modelopt_distill:
    extends: slurm_optimize_modelopt_quantize
    env_vars:
      OPTIM_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/optimize/distill

  # optimize/modelopt/prune: pruning can run with fewer tasks than full-node train jobs.
  slurm_optimize_modelopt_prune:
    extends: slurm_base
    container_image: nvcr.io/nvidia/nemo:26.04
    nodes: 1
    ntasks_per_node: 2
    gpus_per_node: 2
    time: "02:00:00"
    env_vars:
      OPTIM_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/optimize/prune

  # eval/model_eval (launcher mode, `-c default`): the launcher owns scheduling
  # and can deploy a Megatron checkpoint itself, so this keeps the GPU base.
  slurm_eval_model_eval:
    extends: slurm_base
    nodes: 1
    time: "02:00:00"
    env_vars:
      EVAL_OUTPUT_DIR: ${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/eval/model_eval

  # eval/model_eval (direct mode, `-c direct`): the harness runs in THIS job
  # against an endpoint you host yourself, so the job needs no GPU -- the GPUs
  # are wherever the model is served.
  #
  # Two things deliberately absent:
  #   container_image -- direct.yaml owns the harness image via
  #     EVAL_HARNESS_IMAGE, and build_job_config() re-applies YAML-owned
  #     resource keys after merging this file, so a profile image is ignored.
  #   EVAL_HARNESS_IMAGE in env_vars -- profile env_vars merge OVER the
  #     config's, so a default here would overwrite direct.yaml's
  #     self-forwarding `EVAL_HARNESS_IMAGE: ${run.env.container_image}` and the
  #     pod would resolve its own image to an empty string.
  #
  # On Slurm the endpoint is usually served in a separate allocation, or an
  # existing one is reused; either way it is just a URL to this job.
  slurm_eval_direct:
    extends: slurm_base
    partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_partition: ${oc.env:SLURM_CPU_PARTITION,cpu}
    build_include_gpus: false
    build_gpus_per_node: 0
    nodes: 1
    ntasks_per_node: 1
    cpus_per_task: 8
    gpus_per_node: 0
    # A bounded split of a large benchmark runs in tens of minutes; an
    # unbounded one does not. Raise this before removing EVAL_LIMIT_SAMPLES.
    time: "04:00:00"
    # The harness image ships nemo_evaluator and the benchmark venvs -- it is
    # NOT a Nemotron image and has none of Nemotron's own runtime deps. This
    # list is redeclared in full because pip_extras is a list: a child value
    # REPLACES the parent's rather than extending it.
    pip_extras:
      - typer
      - rich
      - pydantic-settings
      - omegaconf
      - tomli
      - wandb
    # direct.yaml resolves these INSIDE the job, so every one it reads must be
    # forwarded here; exporting them in your shell only affects submission.
    env_vars:
      EVAL_ENDPOINT_URL: ${oc.env:EVAL_ENDPOINT_URL,''}
      EVAL_MODEL_HANDLE: ${oc.env:EVAL_MODEL_HANDLE,''}
      EVAL_RESULTS_DIR: ${oc.env:EVAL_RESULTS_DIR,${oc.env:NEMOTRON_WORKSPACE,/lustre/${oc.env:USER}}/output/eval/model_eval}
      EVAL_ENDPOINT_TYPE: ${oc.env:EVAL_ENDPOINT_TYPE,completions}
      EVAL_API_KEY_NAME: ${oc.env:EVAL_API_KEY_NAME,ENDPOINT_TOKEN}
      EVAL_TOKENIZER: ${oc.env:EVAL_TOKENIZER,null}
      EVAL_LIMIT_SAMPLES: ${oc.env:EVAL_LIMIT_SAMPLES,null}
      ENDPOINT_TOKEN: ${oc.env:ENDPOINT_TOKEN,''}
