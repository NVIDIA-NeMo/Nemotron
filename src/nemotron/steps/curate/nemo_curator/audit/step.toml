[step]
id = "curate/audit"
name = "Curated Corpus Integrity Audit"
category = "curate"
description = """Integrity evidence for a curated corpus: per-shard readability, row counts, and a content digest, compared against a manifest declared by the producing step. Completeness is claimed only relative to that manifest. Detection only: attributing loss to a cause requires a producer-emitted ledger."""
tags = ["curate", "audit", "integrity"]

[[consumes]]
type = "filtered_jsonl"
description = "Corpus to audit. decontaminated_jsonl is accepted too, and is what the flow passes when curate/decontamination runs."

[[consumes]]
type = "curation_manifest"
required = false
description = "The producing step's own account of the run. Without it row counts are informational and completeness is not claimed, so its absence is reported rather than assumed benign."

[[consumes]]
type = "curation_ledger"
required = false
description = "Optional per-stage ledgers from the producing steps. Their presence is what turns detection into attribution."

[[produces]]
type = "curation_report"
description = "Per-shard readability and digests, row counts, manifest comparison, optional reference delta."

[[parameters]]
name = "target_glob"
description = "JSONL files to audit."

[[parameters]]
name = "output_dir"
description = "Directory for audit_report.json."

[[parameters]]
name = "ledger_glob"
description = "Per-stage ledgers written by the producing steps. Without them this audit detects loss but cannot attribute it: a record missing from the output is indistinguishable from one removed on purpose. With them, the report says how many records each gate removed and how many left for a reason nobody recorded."
default = "null"

[[parameters]]
name = "declared_manifest"
description = "Manifest emitted by the producing step. Required for any completeness claim. Without it, row counts are reported as informational."
default = "null"

[[parameters]]
name = "reference_glob"
description = "Upstream corpus this was derived from. Null = no row delta. Required for containment mode."
default = "null"

[[parameters]]
name = "mode"
description = "integrity | digest | containment | all"
default = "integrity"
choices = ["integrity", "digest", "containment", "all"]

[[parameters]]
name = "comparison_fields"
description = "Fields compared in containment mode. Empty fails: the pipeline adds language and domain columns, so an implicit 'all common fields' default reports differences that are the pipeline working as intended."
default = []

[[parameters]]
name = "source_field"
description = "Field naming each record's source corpus, for per-source counts. Taken from the declared manifest when one is supplied."
default = "null"

[[parameters]]
name = "digest_root"
description = "Directory that shard paths in the digest are made relative to, so the digest survives moving the corpus."
default = "null"

[[strategies]]
when = "curate/nemo_curator produced less output than expected"
then = "Set declared_manifest to the manifest it emitted; the per-source delta shows where records went."

[[strategies]]
when = "You must prove a re-delivered corpus is unchanged"
then = "Set mode=digest and diff the digest against the previous release. It is independent of the order files are enumerated in, and deliberately sensitive to shard names so the report can say which shard moved."

[[strategies]]
when = "You need to prove a subset was drawn from a specific corpus"
then = "Set mode=containment, reference_glob to the parent corpus, and comparison_fields to [id] when the corpus carries a stable identifier."

[[errors]]
name = "attribution_disagreement"
recovery = "The run manifest and the curation ledger attribute the same removals to different gates. One step writes both, in one run, reconciling each independently against its own count of the files on disk — so a difference means one of the two reconciliations is wrong and neither breakdown can be quoted. Re-run the producing step; if it persists, the per-stage counters and the disk counts disagree and the breakdown should be treated as unavailable rather than corrected by hand."

[[errors]]
name = "ledger_unreadable"
recovery = "A file matched by ledger_glob is not a readable ledger. The audit reports it rather than skipping it: a ledger that cannot be read is a stage whose accounting is unknown, which is not the same as a stage with nothing to report."

[[errors]]
name = "unaccounted_gain"
recovery = "The output holds MORE records than the input minus what the ledgers declare removed. Filtering cannot cause rows to appear, so this is a retried or duplicated write, or an output directory that was not empty before the run. Reported separately from unexplained_loss because a negative loss count states the reverse of what happened."

[[errors]]
name = "unexplained_loss"
recovery = "Records left the pipeline for a reason no stage recorded. The ledgers account for what was filtered, failed and quarantined; the remainder is unattributed and cannot be recovered by reading the output. Check the producing stage for a caught exception that did not record a terminal state."

[[errors]]
name = "ledger_imbalanced"
recovery = "A stage reported success while n_input did not equal success + filtered + failed + quarantined. The stage's own accounting is wrong, so every figure derived from it is suspect. Fix the stage before trusting the corpus."

[[errors]]
name = "lost_units"
recovery = "One or more shards or sources could not be processed. The record count in the message is a FLOOR — a shard too damaged to open reports zero rows, so a record-count gate cannot see this loss at all. Re-run the failed units before using the corpus."

[[errors]]
name = "unreadable_shard"
recovery = "A shard holds a record that will not parse — usually a writer killed mid-record. The finding names the file and the byte offset where parsing stopped. Re-run the producing stage for that partition. A shard that is empty but well-formed is reported separately as the zero_row_shard observation, because a strict filter can empty one legitimately."

[[errors]]
name = "manifest_incomplete"
recovery = "The manifest has no completed_at; the producing run did not finish. Re-run before shipping."

[[errors]]
name = "manifest_mismatch"
recovery = "Row counts disagree with the producer's declared manifest. Do not ship; check the producer's logs for swallowed worker exceptions."

[[errors]]
name = "containment_unverifiable"
recovery = "Containment could not be established because records could not be keyed — usually comparison_fields names a field the corpus does not carry. A pass cannot be claimed over rows that were never compared. Check the field names against the data."

[[errors]]
name = "unreadable_reference_shard"
recovery = "A shard in reference_glob is damaged, which makes the target look like it gained rows. Repair the reference before reading any comparison against it."

[[errors]]
name = "duplicate_ids"
recovery = "The identifier repeats while the producer's manifest declares duplicate_ids='reject'. Either the identifier does not identify a document, or the manifest should declare 'multiset'."

[[errors]]
name = "containment_violation"
recovery = "Rows in the target are absent from the reference corpus. Check that reference_glob names the corpus the target was actually derived from, and that comparison_fields identifies records rather than fields the pipeline rewrites."

[reference]
skill = "src/nemotron/steps/curate/nemo_curator/audit/README.md"
docs = "https://docs.nvidia.com/nemo/curator/latest/"
