# Tiny audit smoke over the packaged fixture.
#
# Exercises the full path a real run takes: readability, per-source counts, a
# content digest, and comparison against a manifest the fixture ships with. The
# fixture manifest is generated by runtime/manifest.py, so this also checks that
# the producer and auditor agree on the schema.

target_glob: /nemo_run/code/src/nemotron/steps/curate/nemo_curator/audit/data/tiny/*.jsonl
output_dir: ${oc.env:NEMO_RUN_DIR,${oc.env:PWD}/output}/curate_audit_tiny

# Per-stage ledgers from the producing steps. Without them this audit detects
# loss but cannot attribute it. Null keeps the detection-only behaviour.
ledger_glob: null

declared_manifest: /nemo_run/code/src/nemotron/steps/curate/nemo_curator/audit/data/tiny/run_manifest.json

reference_glob: null

# digest, not all: containment needs a reference corpus, and shipping a second
# fixture only to compare it against the first would test the fixture rather
# than the step. Containment is covered by tests/steps/curate/test_integrity.py.
mode: digest

comparison_fields: []

source_field: source
digest_root: /nemo_run/code/src/nemotron/steps/curate/nemo_curator/audit/data/tiny
