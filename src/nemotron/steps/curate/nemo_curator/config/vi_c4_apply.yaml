# Worked example, step 2 of 2: APPLY the policy.
#
#   rm -rf ./output/vi/filtered_jsonl ./output/vi/audit ./output/vi/subset
#   uv run python -m nemotron.steps.curate.nemo_curator.scripts.run_flow \
#     --config src/nemotron/steps/curate/nemo_curator/config/vi_c4_apply.yaml
#
# The flow is a script, not a registered step, so it takes a config PATH and
# accepts no key=value overrides. Copy this file and edit the paths inside it.
# Add --plan to print the derived per-step configs without running anything.
#
# Identical to vi_c4_measure.yaml except for two things: profile is off, and the
# approve block is filled in. Everything above `steps:` MUST match run 1 exactly.
# The approved policy carries a fingerprint of the corpus it was measured on, and
# the flow verifies it after ingest commits — a corpus that changed between the
# two runs is refused rather than silently approved on the wrong evidence.
#
# The flow also refuses to write into a filtered_jsonl that already holds a
# corpus, because it appends rather than replaces and every later step would then
# read both. Delete the three directories above first; keep ingested/ and
# profile/, which run 2 does not rewrite.

corpus:
  input: ./raw/vi/*.parquet
  text_field: text
  id_field: id
  id_fields: [url, text]
  id_prefix: "c4vi-"
  source_field: source
  source_value: c4_vi
  metadata_fields: [id, source, url]
  language: vi
  # The shipped vi example pack. Point this at your own reviewed pack root
  # for a production run; the bundled pack is example data, not a default.
  langpack_dir: ./src/nemotron/steps/curate/nemo_curator/data/langpacks

output_root: ./output/vi

steps:
  ingest:
    enabled: true
    format: parquet
    on_duplicate: refuse
    keep_fields: [url]

  # Off. The corpus was measured on run 1 and profile/ still holds that evidence.
  # Leaving it on costs a second full pass and changes nothing.
  profile:
    enabled: false

  filter:
    enabled: true
    mode: both
    language_codes: [VI]
    quality_filters:
      min_langid_score: 0.3
      min_words: 50
      max_words: 100000
    domains: []
    annotate_domains: false
    domain_score_field: null
    heuristic_filters: null
    dataset: null
    models:
      fasttext_langid: null

  audit:
    enabled: true
    mode: all
    comparison_fields: [id]

  decontamination:
    enabled: false
    holdout: null
    threshold: 0.8
    shingle_kind: char
    skip_similarity: true

  # Now worth enabling: with a policy applied, filter writes __<signal> columns
  # that subset can stratify on without a second pass over the corpus.
  subset:
    enabled: true
    token_budgets: [100000000, 500000000]
    tokenizer:
      name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
      revision: 97ab8012882a655dc38df4fee47422aca9caca07
    token_cache: ./cache/vi/token_counts.json
    # Now usable, because the policy below makes steps.filter write a
    # `__script_ratio` column on every surviving document.
    #
    # Without it, tiers are stratified by source and length only, and a 100M-token
    # tier drawn from a 2B-token corpus can come out systematically cleaner than
    # the corpus it claims to represent. With it, each length band is also split
    # by score, so the tier keeps the corpus's score distribution.
    #
    # Two constraints the flow checks before running:
    #   - the column must come from a signal in `approve.thresholds` below;
    #     __script_ratio works here, __latin_ratio would not.
    #   - steps.filter.mode must be `annotate` or `both`. Under `filter` the
    #     scores are used and discarded, so the column never reaches the output.
    quality_score_field: __script_ratio
    length_bands: [128, 512, 2048, 8192]
    seed: 0

# ── The part that only exists after run 1 ────────────────────────────────────
# Copied from the `Approve block` section of output/vi/profile/profile_summary.md
# and then edited. The profile offers the least aggressive threshold on each
# curve; these are four of them, chosen to show what the shapes look like rather
# than to be a recommendation.
#
# Every value is a swept grid point. The grid is i/63, so round numbers like 0.30
# are never measured and their retention is not in the report; promote() warns
# when you pick one.
#
# `max` is an upper bound and documents above it are dropped; `min` is a lower
# bound. Which key a signal takes is fixed by the registry, not chosen here —
# writing the other one is refused rather than applied backwards.
approve:
  thresholds:
    # Curator's non-English cascade applies no character-composition gate at all.
    # This is the Unicode-aware replacement: at Curator's own 0.25 it retains
    # 93.66% here, where the ASCII filter it replaces would retain 1.40%.
    - {signal: unicode_alpha_numeric, max: 0.3333333333333333}   # keeps 99.18%

    # Smooth decay with no natural cut point: 12,137 documents in the first
    # histogram bin, then 3,947, 1,746, 880. Any threshold here is a budget
    # decision, not a boundary the data drew.
    - {signal: numbers_ratio, max: 0.25396825396825395}          # keeps 99.00%

    # The opposite shape, and the reason to look at the histogram before
    # choosing: 96.8% of documents score above 0.96 and only 2.9% fall in the 29
    # bins between 0.05 and 0.96. Anywhere in that empty region separates the
    # same two populations, which is why 0.4286 keeps 99.00% and 0.9841 still
    # keeps 96.50%. Needs the language pack.
    - {signal: script_ratio, min: 0.42857142857142855}           # keeps 99.00%

    # A two-sided signal is written like this, with BOTH bounds — given one, the
    # other is fixed at an unstated value and the whole effect is attributed to
    # the bound you set. word_count, mean_word_length and token_count are the
    # three, and the approve block does not offer them, so they are hand-written.
    #
    #   - {signal: word_count, min: 50, max: 100000}   # Curator's own, keeps 90.91%
    #
    # It stays commented here because steps.filter.quality_filters above already
    # gates length. Declaring the same gate twice builds two stages for it, and
    # the per-stage counters then do not reconcile with the removal measured on
    # disk — so curate/nemo_curator discards the whole per-gate breakdown and
    # records 2,522 'unattributed' instead of naming what dropped what. Gate
    # length in one place: either quality_filters or the policy, not both.

  # Recorded, never required, and worth nothing to a machine — the gate rests on
  # the corpus fingerprint, the profile digest, the scorer version and the
  # direction of every bound. It is worth everything to the next person.
  approver: you@example.com
  date: 2026-01-01
  method: manual
  evidence: >-
    Retention curves on 20,000 c4_vi documents, all four values swept grid
    points. script_ratio cuts an empty region between two populations, so the
    choice inside it barely moves retention. numbers_ratio has no natural
    boundary and was chosen as a 1% budget, not as a quality judgement.
    Replace this with what you actually looked at: a name here proves nothing,
    but the reasoning is the only record of why these numbers and not others.
