# Starter config for lightweight JSONL curation with NeMo Curator.
# If dataset is non-null, snapshot_download runs first and input_glob should
# point into dataset.local_dir. Set dataset: null for local JSONL-only runs.
# Optional filters are controlled by language_codes, domains, and
# quality_filters. Empty values disable those stages.

language_codes:
  - EN

domains: []
text_field: text
input_glob: ./data/fineweb-edu/**/*.jsonl
output_dir: ./output/filtered_jsonl

# JsonlReader treats fields as a projection: anything not listed here is dropped
# at the first stage. Empty keeps the historical text-only read. List the columns
# you need downstream, e.g. [id, url, source, timestamp].
metadata_fields: []

# Recorded in the run manifest. id_field should name the corpus's own document
# identifier — it is the only ID that survives resharding.
id_field: null
source_field: null

# How an approved policy is applied. Ignored unless heuristic_filters names one.
#   filter    drop rows, discard scores, add no columns (current behaviour)
#   annotate  score every row; the POLICY drops nothing. NOT a non-destructive
#             mode -- language_codes, quality_filters and domains still drop rows.
#   both      drop rows, and keep each score in __<signal> for the survivors
mode: filter

# An approved filtering policy. curate/profile emits candidate_policies.yaml with
# approved: false, which is refused here on purpose — promoting a candidate is a
# separate act that records who approved it and on what evidence.
heuristic_filters: null

# Path for the run manifest. Null writes none, matching current behaviour.
emit_manifest: null

# Path for the record ledger that curate/audit reads to attribute a loss rather
# than only detect it. Null writes none. Curator reports no per-stage removal
# counts, so the ledger records how many documents entered and left and marks
# them 'unattributed' — it does not name a gate it cannot observe.
emit_ledger: null

dataset:
  repo_id: HuggingFaceFW/fineweb-edu
  repo_type: dataset
  local_dir: ./data/fineweb-edu
  allow_patterns:
    - data/*.jsonl

models:
  fasttext_langid: ./cache/models/fasttext/lid.176.bin
  hf_cache_dir: ./cache/huggingface

quality_filters:
  min_langid_score: 0.3
  # min_words / max_words are NOT set here on purpose.
  #
  # Setting both enables Curator's WordCountFilter, which splits on whitespace.
  # That is a sound gate for a space-delimited language and meaningless for one
  # that is not: measured on 20,000 documents, `min_words: 50` removes 39% of a
  # Japanese corpus and 33% of a Thai one -- not because those documents are
  # short, but because the whole document counts as one word.
  #
  # A default cannot know the language, so it must not choose for you. Set both
  # keys to enable the filter. If the run declares a language pack, the pack has
  # to declare `word_segmentation` or the run is refused rather than silently
  # measuring nothing:
  #
  #   min_words: 50
  #   max_words: 5000
