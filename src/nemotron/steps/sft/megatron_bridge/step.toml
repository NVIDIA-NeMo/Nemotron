[step]
id = "sft/megatron_bridge"
name = "SFT Training (Megatron-Bridge)"
category = "sft"
description = """\
Supervised fine-tuning using NVIDIA Megatron-Bridge. Best for large-scale
distributed training with tensor/pipeline/context parallelism. Requires
packed Parquet data; standard profiles use data_prep/sft_packing. Includes
experimental long-context topology references."""
tags = ["sft", "fine-tuning", "megatron", "distributed-training", "long-context"]

[[consumes]]
type = "packed_parquet"
description = "Packed SFT Parquet shards with input_ids + loss_mask"
required = true

[[consumes]]
type = "checkpoint_megatron"
description = "Base pretrained checkpoint or a prior Megatron SFT checkpoint"
required = false

[[produces]]
type = "checkpoint_megatron"
description = "Fine-tuned Megatron checkpoint"

[[models]]
name = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16"
description = "Nemotron 3 Nano 30B-A3B (31.6B total / 3.2B active hybrid Mamba-Transformer MoE). Default Nano3 path."
default = true
min_gpus = 8

[[models]]
name = "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16"
description = "Nemotron 3.5 Lightning 30B-A3B (hybrid Mamba-Transformer MoE with MTP). Lightning35 path."
min_gpus = 8

[[models]]
name = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"
description = "Nemotron 3 Super 120B-A12B (120.6B total / 12.7B active hybrid Mamba LatentMoE). Typically starts at 32 GPUs."
min_gpus = 32

[[parameters]]
name = "recipe.seq_length"
description = "Recipe sequence length. Keep it equal to dataset.seq_length, packed_sequence_size, model.seq_length, and the prepared pack size."
default = 4096
choices = [2048, 4096, 8192, 16384, 32768]

[[parameters]]
name = "dataset.seq_length"
description = "Dataset sequence length. Change it together with recipe.seq_length, packed_sequence_size, and model.seq_length."
default = 4096
choices = [2048, 4096, 8192, 16384, 32768]

[[parameters]]
name = "dataset.packed_sequence_specs.packed_sequence_size"
description = "Offline-packed sample size. It must match all configured sequence lengths and the prepared data."
default = 4096
choices = [2048, 4096, 8192, 16384, 32768]

[[parameters]]
name = "model.seq_length"
description = "Model sequence length. Change it together with the recipe and dataset sequence lengths."
default = 4096
choices = [2048, 4096, 8192, 16384, 32768]

[[parameters]]
name = "dataset.packed_sequence_specs.packed_train_data_path"
description = "Packed training Parquet glob, usually data_prep/sft_packing output_dir/splits/train/*.parquet."

[[parameters]]
name = "peft"
description = "'lora' = the shipped 30B default, 'null' = full SFT when the model fits"
default = "lora"
choices = ["null", "lora"]

[[parameters]]
name = "checkpoint.pretrained_checkpoint"
description = "Optional Megatron base checkpoint or prior SFT checkpoint. Keep it distinct from the output checkpoint.save path."

[[parameters]]
name = "train.micro_batch_size"
description = "Per-rank micro batch size. Start at 1 when validating a new distributed shape."
default = 1

[[parameters]]
name = "train.global_batch_size"
description = "Global batch size. Keep it divisible by the resulting data-parallel size."

[[strategies]]
when = "dataset < 10K records"
then = "reduce global_batch_size and increase train_iters to keep optimizer steps useful"

[[strategies]]
when = "consuming packed Parquet"
then = "Set recipe.packed_sequence=true and keep dataset.seq_length, dataset.packed_sequence_specs.packed_sequence_size, model.seq_length, and data_prep pack_size identical."

[[strategies]]
when = "user wants LoRA"
then = "set recipe.peft=lora to reduce GPU requirements and checkpoint size"
skill = "Megatron-Bridge/skills/mlm-bridge-training/SKILL.md"

[[strategies]]
when = "user selects Super3 model at 32K context or shorter"
then = "start from a 32-GPU plan with tp=8, pp=4, cp=1 and verify cluster topology early"
skill = "Megatron-Bridge/skills/perf-techniques/parallelism-strategies/SKILL.md"

[[strategies]]
when = "sequence_length > 32K"
then = "use a config/super3 long-context YAML only for dry-run planning, then add and verify packing-alignment and mixed-precision support before launch"
skill = "Megatron-Bridge/skills/perf-techniques/hybrid-context-parallel/SKILL.md"

[[strategies]]
when = "user selects Super3 with 128K context"
then = "inspect config/super3_128k.yaml with --dry-run for a 64-rank TP=8, PP=1, CP=8, EP=64 topology; do not launch it with the stock step"
skill = "Megatron-Bridge/skills/perf-techniques/hybrid-context-parallel/SKILL.md"

[[strategies]]
when = "user selects Super3 with 256K context"
then = "inspect config/super3_256k.yaml with --dry-run for a 128-rank TP=8, PP=2, CP=8, EP=8 topology; do not launch it with the stock step"
skill = "Megatron-Bridge/skills/perf-techniques/hybrid-context-parallel/SKILL.md"

[[strategies]]
when = "tokenizer, sequence length, TP, CP, or sequence parallelism changes"
then = "use an external alignment-aware packer, write to a new output directory, and revalidate stored lengths and loss masks"

[[strategies]]
when = "GPU memory is tight (A100 40GB)"
then = "enable activation checkpointing and consider CPU offloading"
skill = "Megatron-Bridge/skills/perf-techniques/megatron-fsdp/SKILL.md"

[[strategies]]
when = "want maximum throughput on H100"
then = "keep packed sequences enabled and tune overlap / sequence-packing settings before scaling up"
skill = "Megatron-Bridge/skills/perf-techniques/sequence-packing/SKILL.md"

[[errors]]
name = "tokenizer_mismatch"
recovery = "set data_prep/sft_packing tokenizer to match the training model"

[[errors]]
name = "oom"
recovery = "reduce batch size, increase parallelism, or reduce seq_length"
skill = "Megatron-Bridge/skills/perf-techniques/parallelism-strategies/SKILL.md"

[[errors]]
name = "missing_packed_data"
recovery = "For standard profiles, run data_prep/sft_packing or point at compatible packed shards. The Super3 long-context references require pre-existing shards explicitly aligned to 128."

[[errors]]
name = "bad_parallel_batch_shape"
recovery = "Set train.global_batch_size as a multiple of data-parallel size and start with train.micro_batch_size=1 while validating TP/PP/CP."

[[errors]]
name = "bad_loss_masks_or_template"
recovery = "Inspect packed records from data_prep/sft_packing before training; prompt/template bugs often look like poor SFT quality."

[[errors]]
name = "misaligned_packed_sequences"
recovery = "Use an external or updated packer that explicitly aligns every stored subsequence; alignment is not configurable through the stock GA_v2 SFT step."

[reference]
skill = "src/nemotron/steps/sft/megatron_bridge/README.md"
recipe = "src/nemotron/recipes/nano3/stage1_sft/"
super3_recipe = "src/nemotron/recipes/super3/stage1_sft/"
config = "src/nemotron/recipes/nano3/stage1_sft/config/default.yaml"
script = "src/nemotron/recipes/nano3/stage1_sft/train.py"
megatron_bridge_repo = "https://github.com/NVIDIA-NeMo/Megatron-Bridge"
megatron_bridge_readme = "https://github.com/NVIDIA-NeMo/Megatron-Bridge/blob/main/README.md"
megatron_bridge_docs = "https://docs.nvidia.com/nemo/megatron-bridge/latest/"
training_entry_points = "https://docs.nvidia.com/nemo/megatron-bridge/latest/training/entry-points.html"
packed_sequences_docs = "https://docs.nvidia.com/nemo/megatron-bridge/latest/training/packed-sequences.html"
skills = ["skills/nemotron-customize/references/context/mbridge-sft.txt"]
