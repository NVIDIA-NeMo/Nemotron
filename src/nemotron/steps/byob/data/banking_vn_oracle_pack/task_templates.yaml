# Templates are grouped by category. tasks_per_category is shared by every
# template in a category, so each policy edge below keeps at least one instance.
#
# No template declares tools_present: omitting it exposes the whole tool catalog,
# which is what a deployed assistant sees and what makes selecting the right tool a
# real decision rather than a choice between two candidates.

# --- balance_inquiry ---------------------------------------------------------

- template_id: bn_balance_single
  intent: check_account_balance
  category: balance_inquiry
  difficulty: easy
  turn_policy: single_turn
  call_order: strict
  required_tools: [get_account_balance]
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
  success_assertions: [assert_account_balance_reported]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Cho mình xem số dư tài khoản {account_id}."
  assistant_milestones:
    - {type: tool_call, tool: get_account_balance}
    - {type: final_answer}

- template_id: bn_card_limit_single
  intent: check_card_limit
  category: balance_inquiry
  difficulty: easy
  turn_policy: single_turn
  call_order: strict
  required_tools: [get_card_limit]
  slots:
    card_id:
      source: "fixture:cards.card_id"
      visible_in_first_turn: true
  success_assertions: [assert_card_limit_reported]
  paraphrase: {allowed: false}
  user_turn_templates:
    vi: "Hạn mức còn lại của thẻ {card_id} là bao nhiêu?"
  assistant_milestones:
    - {type: tool_call, tool: get_card_limit}
    - {type: final_answer}

- template_id: bn_card_limit_withheld_card
  intent: check_card_limit
  category: balance_inquiry
  difficulty: medium
  turn_policy: missing_slot
  call_order: strict
  required_tools: [get_card_limit]
  slots:
    card_id:
      source: "fixture:cards.card_id"
      visible_in_first_turn: false
      label: {vi: "mã thẻ cần kiểm tra"}
  success_assertions: [assert_card_limit_reported]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Cho mình kiểm tra hạn mức khả dụng của thẻ."
  assistant_milestones:
    - {type: ask_for_slot}
    - {type: tool_call, tool: get_card_limit}
    - {type: final_answer}
  user_simulator_turns:
    - after: ask_for_slot
      content_template: {vi: "Mã thẻ là {card_id}."}

- template_id: bn_balance_withheld_account
  intent: check_account_balance
  category: balance_inquiry
  difficulty: medium
  turn_policy: missing_slot
  call_order: strict
  required_tools: [get_account_balance]
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: false
      # Names the withheld value in prose, so the pack-wide ask_for_slot template
      # reads naturally instead of quoting the slot key.
      label:
        vi: "mã tài khoản cần kiểm tra"
  success_assertions: [assert_account_balance_reported]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Cho mình xem số dư tài khoản của mình với."
  assistant_milestones:
    - {type: ask_for_slot}
    - {type: tool_call, tool: get_account_balance}
    - {type: final_answer}
  user_simulator_turns:
    - after: ask_for_slot
      content_template:
        vi: "Tài khoản {account_id} nhé."

- template_id: bn_clarify_lookup_target
  intent: clarify_lookup_target
  category: balance_inquiry
  difficulty: medium
  turn_policy: clarify_only
  call_order: strict
  required_tools: []
  slots:
    subject:
      source: "literal:['số dư tài khoản', 'hạn mức thẻ']"
      visible_in_first_turn: true
  success_assertions: [assert_no_tool_called]
  paraphrase: {allowed: false}
  user_turn_templates:
    vi: "Cho mình kiểm tra {subject} với."
  assistant_turn_templates:
    ask_for_slot:
      vi: "Bạn cho mình biết {subject} của mã nào ạ?"
  assistant_milestones:
    - {type: ask_for_slot}

- template_id: bn_clarify_which_card
  intent: clarify_card_selection
  category: balance_inquiry
  difficulty: medium
  turn_policy: clarify_only
  call_order: strict
  required_tools: []
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
  success_assertions: [assert_no_tool_called]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Tài khoản {account_id} của mình gắn nhiều thẻ, cho mình xem hạn mức thẻ với."
  assistant_turn_templates:
    ask_for_slot:
      vi: "Bạn cho mình biết mã thẻ nào của tài khoản {account_id} cần xem hạn mức ạ?"
  assistant_milestones:
    - {type: ask_for_slot}

- template_id: bn_balance_unknown_account
  intent: check_account_balance
  category: balance_inquiry
  difficulty: medium
  turn_policy: negative_path
  call_order: strict
  required_tools: [get_account_balance]
  slots:
    account_id:
      source: "absent:accounts"
      visible_in_first_turn: true
  success_assertions: [assert_account_not_found]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Tài khoản {account_id} của mình còn bao nhiêu tiền?"
  assistant_turn_templates:
    final_answer:
      vi: "Mình không tìm thấy tài khoản {account_id} trong hệ thống."
  assistant_milestones:
    - {type: tool_call, tool: get_account_balance}
    - {type: final_answer}

- template_id: bn_balance_and_card_parallel
  intent: check_balance_and_card_limit
  category: balance_inquiry
  difficulty: medium
  turn_policy: multi_tool
  call_order: any
  required_tools: [get_account_balance, get_card_limit]
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      filter: "account_type == 'payment'"
      visible_in_first_turn: true
    card_id:
      source: "fixture:cards.card_id"
      visible_in_first_turn: true
  success_assertions: [assert_account_balance_reported, assert_card_limit_reported]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Cho mình xem số dư tài khoản {account_id} và hạn mức thẻ {card_id} luôn nhé."
  assistant_milestones:
    - {type: tool_call, tool: get_account_balance, call_group: 0}
    - {type: tool_call, tool: get_card_limit, call_group: 0}
    - {type: final_answer}

- template_id: bn_balance_and_recent_activity_challenge
  intent: reconcile_balance_and_recent_activity
  category: balance_inquiry
  difficulty: hard
  turn_policy: multi_tool
  call_order: any
  required_tools: [get_account_balance, list_recent_transactions]
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
  success_assertions: [assert_account_balance_reported, assert_recent_transactions_listed]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Đối chiếu số dư và các giao dịch gần đây của tài khoản {account_id} giúp mình."
  assistant_milestones:
    - {type: tool_call, tool: get_account_balance, call_group: 0}
    - {type: tool_call, tool: list_recent_transactions, call_group: 0}
    - {type: final_answer}

- template_id: bn_balance_with_unsupported_request
  intent: serve_balance_and_decline_unsupported
  category: balance_inquiry
  difficulty: hard
  turn_policy: single_turn
  call_order: strict
  required_tools: [get_account_balance]
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
    service:
      # One message that mixes a supported lookup with an unsupported product. The
      # capability under test is doing the supported half and refusing the rest,
      # which a candidate that answers all-or-nothing cannot pass.
      source: >-
        literal:[
          'vay tín chấp', 'bảo hiểm nhân thọ', 'mở sổ chứng khoán',
          'tư vấn thuế', 'định giá bất động sản', 'đặt vé máy bay'
        ]
      visible_in_first_turn: true
  success_assertions: [assert_account_balance_reported]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Cho mình xem số dư tài khoản {account_id}, rồi mở luôn {service} giúp mình nhé."
  assistant_milestones:
    - {type: tool_call, tool: get_account_balance}
    - {type: decline}

# --- transaction_status ------------------------------------------------------

- template_id: bn_txn_status_single
  intent: check_transaction_status
  category: transaction_status
  difficulty: easy
  turn_policy: single_turn
  call_order: strict
  required_tools: [get_transaction_status]
  slots:
    transaction_id:
      source: "fixture:transactions.transaction_id"
      visible_in_first_turn: true
  success_assertions: [assert_transaction_status_reported]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Kiểm tra giao dịch {transaction_id} đã thành công chưa."
  assistant_milestones:
    - {type: tool_call, tool: get_transaction_status}
    - {type: final_answer}

- template_id: bn_transaction_id_corrected
  intent: check_transaction_status
  category: transaction_status
  difficulty: hard
  turn_policy: correction
  call_order: strict
  required_tools: [get_transaction_status]
  slots:
    transaction_id:
      source: "fixture:transactions.transaction_id"
      filter: "transaction_id != 'TXN-1001'"
      visible_in_first_turn: true
  success_assertions: [assert_transaction_status_reported]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Kiểm tra trạng thái giao dịch {transaction_id}."
  assistant_milestones:
    - {
        id: acknowledge_lookup,
        type: ask_for_slot,
        content_template: {vi: "Mình sẽ kiểm tra giao dịch {transaction_id}, đúng chứ?"},
      }
    - {type: tool_call, tool: get_transaction_status}
    - {type: final_answer}
  user_simulator_turns:
    - after: acknowledge_lookup
      content_template:
        vi: "Mình ghi nhầm, hãy kiểm tra {transaction_id_corrected}."
      slot_updates:
        transaction_id:
          source: "fixture:transactions.transaction_id"
          filter: "transaction_id == 'TXN-1001'"
          bind_as: transaction_id_corrected

- template_id: bn_list_recent_single
  intent: list_recent_transactions
  category: transaction_status
  difficulty: easy
  turn_policy: single_turn
  call_order: strict
  required_tools: [list_recent_transactions]
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
  success_assertions: [assert_recent_transactions_listed]
  paraphrase: {allowed: false}
  user_turn_templates:
    vi: "Liệt kê vài giao dịch gần đây của tài khoản {account_id}."
  assistant_milestones:
    - {type: tool_call, tool: list_recent_transactions}
    - {type: final_answer}

- template_id: bn_txn_status_unknown_id
  intent: check_transaction_status
  category: transaction_status
  difficulty: medium
  turn_policy: negative_path
  call_order: strict
  required_tools: [get_transaction_status]
  slots:
    transaction_id:
      source: "absent:transactions"
      visible_in_first_turn: true
  success_assertions: [assert_transaction_not_found]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Giao dịch {transaction_id} của mình hiện thế nào rồi?"
  assistant_turn_templates:
    final_answer:
      vi: "Mình không tìm thấy giao dịch {transaction_id} trong hệ thống."
  assistant_milestones:
    - {type: tool_call, tool: get_transaction_status}
    - {type: final_answer}

- template_id: bn_clarify_transaction_next_step
  intent: clarify_transaction_next_step
  category: transaction_status
  difficulty: medium
  turn_policy: clarify_only
  call_order: strict
  required_tools: []
  slots:
    transaction_id:
      source: "fixture:transactions.transaction_id"
      visible_in_first_turn: true
  success_assertions: [assert_no_tool_called]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Giao dịch {transaction_id} có vấn đề, bạn xử lý giúp mình nhé."
  assistant_turn_templates:
    ask_for_slot:
      vi: "Bạn muốn mình kiểm tra trạng thái giao dịch {transaction_id} hay mở tra soát cho giao dịch này ạ?"
  assistant_milestones:
    - {type: ask_for_slot}

- template_id: bn_latest_txn_status_dependent
  intent: check_latest_transaction_status
  category: transaction_status
  difficulty: hard
  turn_policy: dependent_call
  call_order: strict
  required_tools: [list_recent_transactions, get_transaction_status]
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
  success_assertions: [assert_status_checked_from_listed_transaction]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Giao dịch gần nhất của tài khoản {account_id} hiện thế nào?"
  assistant_milestones:
    - {id: recent_list, type: tool_call, tool: list_recent_transactions, call_group: 0}
    # The id below exists only in the listing above, so it must be read from that
    # result rather than bound from a slot.
    - {
        type: tool_call,
        tool: get_transaction_status,
        call_group: 1,
        args: {transaction_id: {from_result: {call: recent_list, path: "transactions.0.transaction_id"}}},
      }
    - {type: final_answer}

- template_id: bn_second_latest_txn_status_dependent
  intent: check_second_latest_transaction_status
  category: transaction_status
  difficulty: hard
  turn_policy: dependent_call
  call_order: strict
  required_tools: [list_recent_transactions, get_transaction_status]
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
  success_assertions: [assert_status_checked_from_listed_transaction]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Kiểm tra trạng thái giao dịch gần thứ hai của tài khoản {account_id}."
  assistant_milestones:
    - {id: recent_list, type: tool_call, tool: list_recent_transactions, call_group: 0}
    - {
        type: tool_call,
        tool: get_transaction_status,
        call_group: 1,
        args: {transaction_id: {from_result: {call: recent_list, path: "transactions.1.transaction_id"}}},
      }
    - {type: final_answer}

- template_id: bn_activity_status_and_balance_chain
  intent: audit_recent_activity_against_balance
  category: transaction_status
  difficulty: hard
  turn_policy: dependent_call
  call_order: strict
  required_tools: [list_recent_transactions, get_transaction_status, get_account_balance]
  slots:
    account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
  success_assertions:
    - assert_recent_transactions_listed
    - assert_status_checked_from_listed_transaction
    - assert_account_balance_reported
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Xem giao dịch gần đây của tài khoản {account_id}, kiểm tra kỹ giao dịch mới nhất, rồi đối chiếu với số dư hiện tại."
  assistant_milestones:
    - {id: recent_list, type: tool_call, tool: list_recent_transactions, call_group: 0}
    - {
        type: tool_call,
        tool: get_transaction_status,
        call_group: 1,
        args: {transaction_id: {from_result: {call: recent_list, path: "transactions.0.transaction_id"}}},
      }
    - {type: tool_call, tool: get_account_balance, call_group: 2}
    - {type: final_answer}

# --- transfer ----------------------------------------------------------------

- template_id: bn_transfer_fee_withheld_destination
  intent: quote_transfer_fee
  category: transfer
  difficulty: medium
  turn_policy: missing_slot
  call_order: strict
  required_tools: [get_transfer_fee]
  slots:
    from_account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
    to_account_number:
      source: "literal:['9876543210', '9988776655']"
      visible_in_first_turn: false
      label: {vi: "số tài khoản nhận"}
    amount_vnd:
      source: "literal:[200000, 500000]"
      visible_in_first_turn: true
    rail:
      source: "literal:['napas']"
      visible_in_first_turn: true
    to_bank_code:
      source: "literal:['970436']"
      visible_in_first_turn: true
  success_assertions: [assert_transfer_fee_reported]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Tính phí chuyển {amount_vnd}đ từ {from_account_id} tới ngân hàng {to_bank_code} qua {rail}."
  assistant_milestones:
    - {type: ask_for_slot, slot: to_account_number}
    - {type: tool_call, tool: get_transfer_fee, args: {to_bank_code: "{to_bank_code}"}}
    - {type: final_answer}
  user_simulator_turns:
    - after: ask_for_slot
      content_template: {vi: "Số tài khoản nhận là {to_account_number}."}

- template_id: bn_transfer_fee_single
  intent: quote_transfer_fee
  category: transfer
  difficulty: easy
  turn_policy: single_turn
  call_order: strict
  required_tools: [get_transfer_fee]
  slots:
    from_account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
    to_account_number:
      source: "literal:['9876543210']"
      visible_in_first_turn: true
    amount_vnd:
      source: "literal:[500000, 2000000, 15000000]"
      visible_in_first_turn: true
    rail:
      source: "literal:['napas']"
      visible_in_first_turn: true
    to_bank_code:
      source: "literal:['970436']"
      visible_in_first_turn: true
  success_assertions: [assert_transfer_fee_reported]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Phí chuyển {amount_vnd}đ từ {from_account_id} sang {to_account_number} ngân hàng {to_bank_code} qua kênh {rail} là bao nhiêu?"
  assistant_milestones:
    - {type: tool_call, tool: get_transfer_fee, args: {to_bank_code: "{to_bank_code}"}}
    - {type: final_answer}

- template_id: bn_clarify_transfer_intent
  intent: clarify_transfer_intent
  category: transfer
  difficulty: medium
  turn_policy: clarify_only
  call_order: strict
  required_tools: []
  slots:
    from_account_id:
      source: "fixture:accounts.account_id"
      visible_in_first_turn: true
    amount_vnd:
      source: "literal:[300000, 750000, 1200000]"
      visible_in_first_turn: true
  success_assertions: [assert_no_tool_called]
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Mình cần {amount_vnd}đ từ tài khoản {from_account_id}, bạn lo giúp mình nhé."
  assistant_turn_templates:
    ask_for_slot:
      vi: "Bạn muốn mình báo phí trước hay chuyển luôn {amount_vnd}đ, và chuyển tới số tài khoản nào ạ?"
  assistant_milestones:
    - {type: ask_for_slot}

- template_id: bn_create_transfer_single
  intent: create_transfer
  category: transfer
  difficulty: medium
  turn_policy: confirmation
  mutates: true
  call_order: strict
  required_tools: [create_transfer]
  slots:
    from_account_id:
      source: "fixture:accounts.account_id"
      filter: "balance_vnd >= 1000000"
      visible_in_first_turn: true
    to_account_number:
      source: "literal:['9876543210']"
      visible_in_first_turn: true
    amount_vnd:
      source: "literal:[200000]"
      visible_in_first_turn: true
    rail:
      source: "literal:['napas']"
      visible_in_first_turn: true
    to_bank_code:
      source: "literal:['970436']"
      visible_in_first_turn: true
  success_assertions: [assert_transfer_committed]
  paraphrase: {allowed: false}
  user_turn_templates:
    vi: "Chuyển ngay {amount_vnd}đ từ {from_account_id} sang {to_account_number} ngân hàng {to_bank_code} qua kênh {rail}."
  assistant_milestones:
    - {type: ask_confirm}
    - {type: tool_call, tool: create_transfer, args: {to_bank_code: "{to_bank_code}", confirm: true}}
    - {type: final_answer}
  user_simulator_turns:
    - after: ask_confirm
      content_template:
        vi: "Tôi xác nhận thực hiện giao dịch."

- template_id: bn_transfer_short_of_funds
  intent: create_transfer
  category: transfer
  difficulty: hard
  turn_policy: negative_path
  mutates: true
  call_order: strict
  required_tools: [create_transfer]
  slots:
    from_account_id:
      source: "fixture:accounts.account_id"
      filter: "balance_vnd <= 500000"
      visible_in_first_turn: true
    to_account_number:
      source: "literal:['9988776655']"
      visible_in_first_turn: true
    amount_vnd:
      # Both amounts exceed every selected account once the NAPAS fee is added.
      # The second value also keeps the release-scale transfer bucket above its
      # 232-row publication budget without duplicating a binding.
      source: "literal:[500000, 750000]"
      visible_in_first_turn: true
    rail:
      source: "literal:['napas']"
      visible_in_first_turn: true
    to_bank_code:
      source: "literal:['970436']"
      visible_in_first_turn: true
  success_assertions: [assert_transfer_rejected_for_funds]
  paraphrase: {allowed: false}
  user_turn_templates:
    vi: "Chuyển {amount_vnd}đ từ {from_account_id} sang {to_account_number} ngân hàng {to_bank_code} qua kênh {rail} giúp mình."
  assistant_turn_templates:
    final_answer:
      vi: "Giao dịch chưa thực hiện được vì số dư tài khoản {from_account_id} không đủ."
  assistant_milestones:
    - {type: ask_confirm}
    - {type: tool_call, tool: create_transfer, args: {to_bank_code: "{to_bank_code}", confirm: true}}
    - {type: final_answer}
  user_simulator_turns:
    - after: ask_confirm
      content_template:
        vi: "Đúng rồi, cứ thực hiện giúp mình."

