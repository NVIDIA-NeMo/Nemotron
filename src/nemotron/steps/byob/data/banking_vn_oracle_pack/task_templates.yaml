  intent: trace_vietqr_payment_to_account_activity
  category: qr_payment
  difficulty: hard
  turn_policy: dependent_call
  call_order: strict
  required_tools: [get_vietqr_payment_status, get_transaction_status, list_recent_transactions]
  slots:
    payment_ref:
      source: "fixture:vietqr_payments.payment_ref"
      filter: "transaction_id != None"
      visible_in_first_turn: true
  success_assertions:
    - assert_vietqr_status_reported
    - assert_status_checked_from_vietqr_payment
    - assert_recent_transactions_listed_from_transaction
  paraphrase: {allowed: true, max_variants: 1}
  user_turn_templates:
    vi: "Tra mã VietQR {payment_ref}, xem giao dịch ngân hàng tương ứng, rồi liệt kê giao dịch gần đây của chính tài khoản đó."
  assistant_milestones:
    # Two hops: the transaction id comes from the QR result, and the account whose
    # activity is listed comes from that transaction, so neither can be guessed.
    - {id: qr_status, type: tool_call, tool: get_vietqr_payment_status, call_group: 0}
    - {
        id: txn_status,
        type: tool_call,
        tool: get_transaction_status,
        call_group: 1,
        args: {transaction_id: {from_result: {call: qr_status, path: "transaction_id"}}},
      }
    - {
        type: tool_call,
        tool: list_recent_transactions,
        call_group: 2,
        args: {account_id: {from_result: {call: txn_status, path: "account_id"}}},
      }
    - {type: final_answer}

