pack_id: banking_vn
version: "0.1.0"
description: "Executable Vietnamese banking and payments oracle pack."
languages:
  - vi
clock: "2026-03-02T09:00:00+07:00"
system_prompt: >-
  Bạn là trợ lý ngân hàng sử dụng công cụ. Hãy gọi các hàm được cung cấp khi chúng
  trả lời được yêu cầu, chỉ dùng giá trị do khách hàng cung cấp hoặc do một lệnh gọi
  trước đó trả về. Hỏi lại trước khi thực hiện thao tác cần xác nhận, và nói rõ khi
  không có công cụ nào xử lý được yêu cầu.
clock_step: null
credit_internal_destination: false
paths:
  tools: tools.json
  backend: backend.py
  fixtures: fixtures.json
  templates: task_templates.yaml
  assertions: assertions.py
  validation_cases: validation_cases.yaml
primary_keys:
  accounts: account_id
  cards: card_id
  transactions: transaction_id
  transfers: transfer_id
  vietqr_payments: payment_ref
  disputes: dispute_id
assistant_turn_templates:
  ask_for_slot:
    vi: "Bạn vui lòng cung cấp {slot_name} ạ."
  ask_confirm:
    vi: "Bạn xác nhận thực hiện với các thông tin đã nêu chứ?"
  decline:
    vi: "Xin lỗi, yêu cầu này nằm ngoài phạm vi hỗ trợ hiện tại."
  final_answer:
    vi: "Đã xong."
absent_ids:
  # Absent identifiers need no fixture row, so each collection lists enough of them
  # for its documented-failure template to bind a distinct instance per publication
  # slot instead of repeating one miss.
